<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Answer</title>
<!-- Answer card: the visual reply to a spoken question, set like a night-edition data story. The question is the kicker,
     the answer the headline, the context the deck, the facts stand at the foot, and a chart or table and the related
     questions fill the right field. Every section starts pending. Fill them in any order; null removes one.

     PATCH KEYS. One patch may hold several keys. They run in this order (the order of PATCH below), so a key can use
     one sent earlier in the same patch. A bad value is refused with a message that says what to send; nothing changes.
       clear      {"clear":true}                          every section back to pending; clears selected and working
       demo       {"demo":true} or {"demo":"table"}       loads SAMPLE.bars or SAMPLE.table; clears selected and working
       question   {"question":"How far is Mars right now?"}                         at most 140 characters
       answer     {"answer":"Mars is about *225 million* kilometres from Earth today."}
                  at most 16 words and 110 characters; star one phrase for the accent
       context    {"context":"Its light takes about 12.5 minutes to reach us."}     one sentence, 40 words, 240 characters
       facts      {"facts":[{"value":"12.5 min","label":"Light travel time"}]}      1 to 3; value at most 16 characters,
                  label at most 40; "12.5 min" shows as numeral and unit
       compare    {"compare":{"title":"Distance from Earth today","unit":"million km","items":[{"label":"Venus","value":118},
                    {"label":"Mars","value":225,"highlight":true,"note":"1.5× the Sun’s distance"}]}}
                  1 to 5 bars, values of 0 or more; the unit shows in the case given; "highlight":true marks an item;
                  a note (at most 32 characters, one item only) shows under its bar only while that bar is highlighted,
                  so it never stays under a bar the highlight left; replaces any table
       table      {"table":{"title":"Side by side","columns":["Laptop","Weight"],"rows":[["Model A","1.4 kg"]],"highlight":1}}
                  instead of compare; 2 to 4 columns, 1 to 4 rows, cells at most 18 characters; highlight is a row number.
                  A row of about 36 characters in all fits on one line; past that the widest column wraps
       highlight  {"highlight":"Jupiter"} or {"highlight":2}      one bar or table row, by label or number; null clears
       related    {"related":["How long would a trip to Mars take?","When is Mars closest to Earth next?"]}
                  1 to 4 follow-up questions of at most 60 characters, numbered on screen; a new list clears selected.
                  Under a tall chart or table the last ones may not fit; app.state() marks those "hidden":true
       selected   {"selected":2}                          marks related question 2; null clears
       sources    {"sources":["orbitdata.example"]}       1 to 5 domain names; those that do not fit show as a count, "+2"
       working    {"working":"Checking sources"}          status line; null hides it
     Rules:
       - compare or table replaces the whole chart, with its highlight. A patch that changes compare must carry the
         highlight too: mark the item "highlight":true, or add a "highlight" key (it runs after compare).
       - highlight needs compare or table, and selected needs related, first or in the same patch.
       - compare:null removes a chart and table:null removes a table; neither removes the other.
     app.state() returns: shown (each filled section as short text), pending, removed, highlight, related ({n, text}, with
     hidden:true if it did not fit on screen), selected, working, and ignored (unknown keys).

     VOICE TURNS, in order. Each patch is complete; copy it and change the words.
       "How far away is Mars right now?"   {"clear":true,"question":"How far away is Mars right now?","working":"Looking it up"}
       (answer arrives)   {"answer":"Mars is about *225 million* kilometres from Earth today.","context":"Its light takes about 12.5 minutes to reach us."}
       (facts, follow-ups and sources arrive)   {"facts":[{"value":"12.5 min","label":"Light travel time"},{"value":"1.5 AU","label":"In Earth–Sun distances"},
           {"value":"26 mo","label":"Between close approaches"}],"related":["How long would a trip to Mars take?",
           "When is Mars closest to Earth next?"],"sources":["orbitdata.example"],"working":null}
       "Compare it with Venus, the Sun and Jupiter"   {"compare":{"title":"Distance from Earth today","unit":"million km","items":[
           {"label":"Venus","value":118},{"label":"Sun","value":148},{"label":"Mars","value":225,"highlight":true},{"label":"Jupiter","value":765}]}}
       "Highlight Jupiter instead"   {"highlight":"Jupiter"}
       "Show the distances in light-minutes"   (a new compare, so it carries the highlight)   {"compare":{"title":"Light travel time today",
           "unit":"light-minutes","items":[{"label":"Venus","value":6.6},{"label":"Sun","value":8.2},{"label":"Mars","value":12.5},
           {"label":"Jupiter","value":42.5}]},"highlight":"Jupiter"}
       "Tell me about the second related question"   {"selected":2,"working":"Looking that up"}
           then ask the text of related n:2 from the returned state as a new question:
           {"clear":true,"question":"When is Mars closest to Earth next?","working":"Looking it up"}
       "Start over with a new question: how big is Mars?"   {"clear":true,"question":"How big is Mars?","working":"Looking it up"}

     REMOTE. tv_show uses "remote":"tvos" by default. At rest nothing has focus and the card looks as it does without a
     remote. The first press lands on related question 1, or on the first chart row when there are no questions; it
     neither moves nor selects. Up and down then move through the related questions and the chart's bars or table
     rows. Enter sends the same patch as voice, then reports to tv.state().input:
       Enter on related question n   {"selected":n}, then tv.input("ask", {"item":n,"question":"<its text>"})
       Enter on bar or table row n   {"highlight":n}, then tv.input("highlight", {"item":n,"label":"<its label>"})
     Answer an "ask" as if the person had said the question: start it as a new question with clear, using its text:
       {"clear":true,"question":"When is Mars closest to Earth next?","working":"Looking it up"}
     A "highlight" is already on screen and needs no patch.

     ADDING A SECTION (for example a pull quote). Touch each place, in file order:
       1. this header: a PATCH KEYS line with an example and its limits, placed where the key should run
       2. <style>: one CSS block for the section, and its pending shapes under "Pending"
       3. markup: an element with data-slot="<key>" in .main (left column) or .rail (right field)
       4. SAMPLE: the key in both samples, so {"demo":true} shows it
       5. SLOTS and state: the key, starting undefined (pending)
       6. PENDING and FILL: its kit label and grey shapes, and its filled HTML (escape text with T)
       7. PATCH: one handler named after the key, in the same position; it checks the value, takes null, and fails with an example
       8. SUMMARY: only if app.state() shows the new value badly (it shows text, or the text in a list or object)
       9. REMOTE: only if the person can act on its items: give each item(n) in FILL, wrap them in data-tv-group, add a
          REMOTE handler named after the key, and its line under REMOTE in this header
     In the left column the fit and the solo layout pick up a new section by themselves; the right field only steps
     down to .dense and .tight, then hides related questions. Absent sections collapse: with no chart (.nochart) the
     related questions leave the panel and stand at the foot; with no chart and no related questions (.solo) the left
     column takes the sheet. Then render each of these and check that nothing overlaps the Sources line: {"demo":true};
     {"demo":true,"compare":null}; {"demo":true,"compare":null,"related":null}; {"clear":true,"<key>":...} (the rest
     pending); and that patch with "compare":null,"related":null. -->
<style>
  @font-face { font-family: "Newsreader"; src: url(fonts/newsreader.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Newsreader"; src: url(fonts/newsreader-italic.woff2) format("woff2"); font-weight: 200 800; font-style: italic; }
  @font-face { font-family: "Inter"; src: url(fonts/inter.woff2) format("woff2"); font-weight: 100 900; }

  /* ---- Tokens */
  :root {
    --bg: #0d0c0a; --paper: #f5f0e6; --soft: #d6cfc1; --muted: #b3ab9c; --rule: #3b362d;
    --accent: #ff5d3b; --on-accent: #180804; --bar: #857d6e; --tint: rgba(255, 93, 59, .14);
    --lift: #2a261f;  /* the focused item's fill */
    --ghost: #27231d; --ghost2: #332e26; --dash: #5a5448;  /* pending shapes */
    --serif: "Newsreader", "Iowan Old Style", Georgia, "Noto Serif", system-ui;
    --sans: "Inter", "Noto Sans", system-ui;
  }

  /* ---- Layout: the story on the left, a lighter field on the right, sources and status along the foot. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    color: var(--paper); background: radial-gradient(1500px 1100px at 12% 0%, #1a1611 0%, #100e0c 55%, #0b0a09 100%);
    font: 500 32px/1.3 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, h2, p, ol { margin: 0; }
  ol { padding: 0; list-style: none; }
  .off { display: none !important; }
  .caps { font: 700 28px/1.2 var(--sans); letter-spacing: .13em; text-transform: uppercase; }
  #q, .top h2, .facts .lbl, .rel .t { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* ---- View: answer */
  [data-view="answer"] { height: 100%; box-sizing: border-box; padding: 60px 0 60px 80px; display: grid;
    grid-template-columns: minmax(0, 1fr) 760px; grid-template-rows: minmax(0, 1fr); }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 72px 88px 0; }
  .nosrc:not(.solo) .main { padding-bottom: 0; }
  .main > * { flex: none; }
  .slug { width: 104px; height: 12px; background: var(--accent); }
  #q { margin-top: 30px; max-width: 980px; color: var(--soft); font: 650 28px/1.36 var(--sans); letter-spacing: .13em;
    text-transform: uppercase; -webkit-line-clamp: 3; }
  #a { margin-top: 34px; font: 500 136px/.98 var(--serif); letter-spacing: -.024em; text-wrap: balance; font-variant-numeric: lining-nums; }
  #a em { font-style: italic; color: var(--accent); letter-spacing: -.03em; }
  #c { margin-top: 34px; max-width: 900px; color: var(--soft); font: italic 500 40px/1.3 var(--serif); text-wrap: pretty; }
  #c.long { font-size: 34px; }
  #f { margin-top: auto; padding-top: 36px; }

  /* Facts */
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 44px; }
  .facts li { min-width: 0; padding-top: 20px; border-top: 2px solid var(--rule); }
  .facts .val { display: block; white-space: nowrap; overflow: hidden; line-height: 1; }
  .facts .num { font: 500 var(--fs, 96px)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
  .facts .u { margin-left: 12px; color: var(--soft); font: 700 28px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .facts.wrap .u { display: block; margin: 8px 0 0; }
  .facts .lbl { margin-top: 12px; color: var(--muted); font-size: 28px; line-height: 1.25; }

  /* Right field: chart or table, then the related questions. It runs off the top, bottom and right edges. */
  .rail { display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: -60px 0; padding: 60px 80px 144px 56px;
    background: linear-gradient(180deg, #1c1914 0%, #171511 60%, #14120f 100%); }
  .top { padding-top: 18px; border-top: 2px solid var(--paper); margin-bottom: 26px; }
  .top h2 { font: 600 38px/1.12 var(--serif); letter-spacing: -.005em; text-wrap: balance; }
  .top p { margin-top: 10px; color: var(--muted); letter-spacing: .04em; text-transform: none; }  /* the unit keeps its case: "m" is not "M" */
  #cmp:not(.off) ~ #rel { margin-top: auto; padding-top: 40px; }

  .bars { --vw: 130px; }
  .bars li { position: relative; display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); column-gap: 22px; align-items: center; }
  .bars .l { justify-self: start; max-width: 100%; color: var(--soft); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars .plot { grid-column: 2; display: flex; align-items: center; gap: 14px; padding: 10px 0; border-left: 2px solid var(--muted); }
  .bars .plot i { flex: none; height: 36px; min-width: 4px; width: calc((100% - var(--vw)) * var(--p)); background: var(--bar); transform-origin: 0 50%; }
  .bars .v { font-weight: 650; font-variant-numeric: tabular-nums; color: var(--soft); white-space: nowrap; }
  .bars .hi .l, .bars.m .l { color: var(--paper); font-weight: 750; }
  .bars .hi .plot i { background: var(--accent); }
  .bars .hi .v, .bars.m .v { color: var(--paper); font-weight: 800; }
  .bars .hi::before, tr.hi > th::before, .rel .sel::before { content: ""; position: absolute; left: -36px; top: 18px; width: 16px; height: 20px;
    background: var(--accent); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .bars .note { grid-column: 2; display: flex; gap: 12px; padding: 0 0 12px 20px; border-left: 2px solid var(--muted);
    font: italic 500 30px/1.15 var(--serif); color: var(--paper); }
  .bars .note::before { content: ""; flex: none; width: 20px; height: 14px; margin-top: 2px; border: solid var(--accent); border-width: 0 0 3px 3px; }
  .bars.stack li { grid-template-columns: minmax(0, 1fr); }
  .bars.stack .l { margin-top: 8px; }
  .bars.stack .plot, .bars.stack .note { grid-column: 1; }
  .bars.stack .hi::before { top: 16px; }

  table { width: calc(100% + 16px); margin-left: -16px; border-collapse: collapse; font-size: var(--ts, 32px); line-height: 1.2; font-variant-numeric: tabular-nums; }
  th, td { padding: 19px 0 19px 16px; text-align: right; white-space: nowrap; border-bottom: 2px solid var(--rule); }
  th:first-child { text-align: left; }
  th:last-child, td:last-child { padding-right: 16px; }
  thead th { padding-top: 0; padding-bottom: 14px; color: var(--muted); font: 700 28px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase;
    border-bottom-color: var(--muted); box-sizing: border-box; }
  tbody th { position: relative; font: 600 1.12em/1.1 var(--serif); color: var(--paper); }
  tbody td { font-weight: 550; color: var(--soft); }
  tbody tr:last-child > * { border-bottom: 0; }
  tbody tr.hi > *, table.m tbody tr > * { background: var(--tint); color: var(--paper); font-weight: 750; }
  tr.hi > th::before { left: -20px; }
  table.wrap th, table.wrap td { padding-left: 10px; }
  table.wrap th:first-child { padding-left: 16px; }
  table.wrap thead th { letter-spacing: .03em; }
  table.wrap tbody th { font-size: 1em; }
  table.wrap .w { white-space: normal; }
  table.wrap thead .w span { display: inline-block; width: min-content; min-width: var(--cw); }

  .rel-h { color: var(--muted); padding-bottom: 14px; border-bottom: 2px solid var(--rule); }
  .rel li { position: relative; display: flex; align-items: center; gap: 22px; min-height: 84px; box-sizing: border-box; padding: 10px 0; border-bottom: 2px solid var(--rule);
    color: var(--soft); font-weight: 550; line-height: 1.18; }
  .rel li:last-child { border-bottom: 0; }
  .rel .n { flex: none; width: 56px; height: 56px; display: grid; place-items: center; font: 500 50px/1 var(--serif); color: var(--paper);
    font-variant-numeric: lining-nums tabular-nums; }
  .rel .t { flex: 1; min-width: 0; }
  /* Selected: paint only, so the text keeps its line breaks. */
  .rel li.sel { color: var(--paper); border-bottom-color: var(--accent); }
  .rel li.sel .t { -webkit-text-stroke: .7px; }
  .rel li.sel .n { background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 44px; }
  tr.hi > th::before, .rel .sel::before { top: 50%; margin-top: -10px; }
  #cmp.off + #rel .rel-h { padding-top: 18px; border-top: 2px solid var(--paper); }
  /* No chart: the panel goes and the related questions stand at its foot. */
  .nochart .rail { background: none; }
  .nochart #rel { margin-top: auto; }

  /* Set by fitText. */
  .dense .top { margin-bottom: 16px; }
  .dense .bars .plot { padding: 7px 0; }
  .dense .bars .plot i { height: 28px; }
  .dense .bars, .dense .rel li { font-size: 30px; }
  .dense .bars .hi::before { top: 11px; }
  .dense .rel li { min-height: 66px; padding: 6px 0; }
  .dense .rel .n { width: 48px; height: 48px; font-size: 42px; }
  .dense #cmp:not(.off) ~ #rel { padding-top: 26px; }
  .dense tbody th, .dense td { padding-top: 13px; padding-bottom: 13px; }
  .tight tbody th, .tight td { padding-top: 8px; padding-bottom: 8px; }
  .tight .rel li { min-height: 60px; padding: 4px 0; }
  .tight .rel li:not(.sel) .t { -webkit-line-clamp: 1; }
  .roomy .bars .plot { padding: 16px 0; }
  .roomy .bars .plot i { height: 48px; }
  .roomy .bars:not(.stack) .hi::before { top: 30px; }
  .roomy tbody th, .roomy td { padding-top: 26px; padding-bottom: 26px; }

  /* Sources sit at the foot of the story; the kit's status line sits at the foot of the right field. */
  #src { position: absolute; left: 80px; bottom: 60px; max-width: 1008px; display: flex; align-items: baseline; gap: 20px;
    color: var(--muted); white-space: nowrap; font: 500 28px/1.2 var(--sans); }
  #src .caps { flex: none; }
  #src .list { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--soft); }
  #stage #tv-status { left: 1216px; right: 80px; padding: 0; border-radius: 0; background: none; color: var(--paper);
    font: 700 28px/1.2 var(--sans); letter-spacing: .13em; text-transform: uppercase; gap: 20px; }
  #stage.solo-status #tv-status { left: auto; max-width: 760px; }  /* no right field: the status ends the Sources line */
  #stage #tv-status i { flex: none; border-radius: 0; }
  #stage #tv-status span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Solo: no chart and no related questions. The headline takes the whole sheet and the facts stand in a column.
     --rows is the number of sections in the left column; VIEWS.answer sets it. */
  .solo { grid-template-columns: minmax(0, 1fr); }
  .solo .rail { display: none; }
  .solo .main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: repeat(var(--rows), max-content) 1fr; column-gap: 112px;
    padding-right: 80px; }
  .solo .main > * { grid-column: 1; }
  .solo #c { max-width: 1000px; font-size: 44px; }
  .solo #c.long { font-size: 38px; }
  .solo #f { grid-column: 2; grid-row: 1 / -1; align-self: end; padding: 0; }
  .solo .facts { grid-template-columns: minmax(0, 1fr); row-gap: 44px; }
  .solo.nofacts .main { grid-template-columns: minmax(0, 1fr); }

  /* Pending: the same sheet as a galley proof. The kit writes the label; each slot adds its own grey shapes (.g). */
  #stage [data-slot].tv-pending { color: var(--muted); }
  #stage [data-slot].tv-pending::after { content: none; }
  #f.tv-pending, #cmp.tv-pending, #rel.tv-pending { font-size: 0; }
  #src.tv-pending { font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
  .g { display: block; width: var(--w, 100%); height: var(--h, 22px); background: var(--ghost); }
  .rail .g { background: var(--ghost2); }
  #stage #a.tv-pending { color: var(--dash); font-style: italic; letter-spacing: -.03em; }
  #a .g { height: .6em; margin-top: .38em; }
  #a .g:first-of-type { display: inline-block; margin: 0 0 0 .2em; vertical-align: -.02em; }
  #a .g:nth-of-type(2) { margin-top: .17em; }
  #c .g { margin-top: 30px; }
  #c .g:first-of-type { display: inline-block; margin: 0 0 0 18px; vertical-align: 1px; }
  #src .g { align-self: center; }
  .ghost .lbl .g { margin-top: 8px; }
  .ghost .num, .ghost .n { color: var(--dash); }
  .ghost.bars .plot { border-left-color: var(--dash); }
  .ghost.bars .plot i { background: var(--ghost2); }
  .ghost.bars .l { width: 96px; height: 22px; background: var(--ghost2); }
  .ghost.rel li { border-bottom-color: var(--ghost2); }

  /* Remote focus. Only a remote key gives an item focus. The bridge's tvos helper lifts it 6% in a white ring.
     The item reaches 16px past its text on each side (a table row already does on the left) and takes a raised fill,
     so the ring has room and no rule shows through. Both sides, so its centre stays in line for the helper's
     arrow search. The arrow hides: the ring marks the row, and the lift would push the arrow into it. */
  li[data-n]:focus { margin-inline: -16px; padding-inline: 16px; border-bottom-color: transparent; background: var(--lift); }
  tr[data-n]:focus > * { border-bottom-color: transparent; background: none; }
  /* One box behind the cells: a row's own fill is painted per cell and shows seams once lifted. */
  tr[data-n]:focus::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--lift); }
  tr.hi:focus::after { background-image: linear-gradient(var(--tint) 0 0); }
  [data-n]:focus::before, [data-n]:focus > th::before { visibility: hidden; }
  tr[data-n] { position: relative; }  /* so a lifted row stacks over the next */

  /* Motion: one short entrance when a section changes. */
  .enter { animation: rise 280ms cubic-bezier(.2, .7, .2, 1) both; }
  .enter:not(.held) .plot i { animation: grow 300ms cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<body>
<div id="stage">
  <section data-view="answer">
    <div class="main">
      <div class="slug" aria-hidden="true"></div>
      <p id="q" data-slot="question"></p>
      <h1 id="a" data-slot="answer"></h1>
      <p id="c" data-slot="context"></p>
      <section id="f" data-slot="facts"></section>
    </div>
    <aside class="rail">
      <section id="cmp" data-slot="compare"></section>
      <section id="rel" data-slot="related"></section>
    </aside>
    <footer id="src" data-slot="sources"></footer>
  </section>
</div>
<script>
  const stage = document.getElementById("stage");
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
  new ResizeObserver(fit).observe(document.documentElement);
</script>
<!-- tv-kit:start v2 — copy this block unchanged into every TV app, just before </body>. -->
<style>
  #tv-status { position: absolute; left: 80px; bottom: 60px; z-index: 50; display: flex; align-items: center; gap: 18px;
    padding: 14px 28px 14px 22px; border-radius: 40px; background: rgba(20, 23, 31, .92); color: #c9ccd6;
    font: 500 32px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity 250ms; }
  #tv-status[hidden] { display: flex; opacity: 0; }
  #tv-status i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent, #5b8cff);
    animation: tv-beat 2s steps(2, jump-none) infinite; }
  @keyframes tv-beat { from { opacity: 1; } to { opacity: .3; } }
  [data-slot].tv-pending { color: #8a8e9a; }
  [data-slot].tv-pending::after { content: ""; display: block; width: min(60%, 900px); height: 28px; margin-top: 14px;
    border-radius: 14px; background: #262a34; }
</style>
<script>
  (() => {
    const host = document.getElementById("stage") || document.body;
    const status = document.createElement("div");
    status.id = "tv-status";
    status.setAttribute("role", "status");
    status.hidden = true;
    status.innerHTML = "<i></i><span></span>";
    host.append(status);
    const slot = name => {

<script>
(() => {
// Demo data in patch form: {"demo":true} sends SAMPLE.bars through PATCH, {"demo":"table"} sends SAMPLE.table.
const SAMPLE = {
  bars: {
    question: "How far is Mars right now?",
    answer: "Mars is about *225 million* kilometres from Earth today.",
    context: "It is well past the Sun from our side of the orbit, so its light takes about twelve and a half minutes to reach us.",
    facts: [{ value: "12.5 min", label: "Light travel time" }, { value: "1.5 AU", label: "In Earth–Sun distances" },
      { value: "26 mo", label: "Between close approaches" }],
    compare: { title: "Distance from Earth today", unit: "million km", items: [{ label: "Venus", value: 118 }, { label: "Sun", value: 148 },
      { label: "Mars", value: 225, highlight: true, note: "1.5× the Sun’s distance" }, { label: "Jupiter", value: 765 }] },
    related: ["How long would a trip to Mars take?", "When is Mars closest to Earth next?",
      "Can I see Mars in the sky tonight?", "How big is Mars next to Earth?"],
    sources: ["orbitdata.example", "skyalmanac.example"],
  },
  table: {
    question: "Compare these three laptops",
    answer: "*Model B* is the best pick for most people.",
    context: "It lasts as long as Model A on a charge, weighs less, and costs $500 less than Model C.",
    facts: [{ value: "$999", label: "Model B price" }, { value: "18 h", label: "Battery, Models A and B" },
      { value: "1.1 kg", label: "Lightest: Model C" }],
    table: { title: "Side by side", columns: ["Laptop", "Weight", "Battery", "Price"], highlight: 2,
      rows: [["Model A", "1.4 kg", "18 h", "$1,199"], ["Model B", "1.2 kg", "18 h", "$999"], ["Model C", "1.1 kg", "12 h", "$1,499"]] },
    related: ["Which one has the best screen?", "Which is best for photo editing?", "Show their prices over the last year"],
    sources: ["laptoplab.example", "reviewdesk.example"],
  },
};

// A section is undefined while pending, null when removed, or its value when shown.
const SLOTS = ["question", "answer", "context", "facts", "compare", "related", "sources"];
const state = {
  question: undefined, answer: undefined, context: undefined,
  facts: undefined,    // [{value, label}]
  compare: undefined,  // {kind: "bars", title, unit, items: [{label, value, note}], highlight}
                       // or {kind: "table", title, columns, rows, highlight}; highlight lists bar or row numbers
  related: undefined, sources: undefined,  // lists of strings
  selected: null,      // number of the marked related question
  working: null,       // status line text
};

// ---- Checks return a clean value or throw a message that says what to send.
const fail = message => { throw new Error(message); };
const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
const nf = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
const text = (key, v, max) => {  // a string, or a number written out
  if (typeof v === "number" && Number.isFinite(v)) return nf.format(v);
  const s = typeof v === "string" ? v.trim().replace(/\s+/g, " ") : "";
  if (!s || s.length > max) fail(`${key} must be text of 1 to ${max} characters${s ? ` (got ${s.length})` : ""}.`);
  return s;
};
const optional = (key, v, max) => v == null ? "" : text(key, v, max);
const list = (key, v, max, example, min = 1) =>
  Array.isArray(v) && v.length >= min && v.length <= max ? v : fail(`${key} must be a list of ${min} to ${max}, like ${example}.`);

// Typeset: curly quotes, primes after digits, en dashes, minus signs, ellipses and multiplication signs.
const typo = s => String(s)
  .replace(/(\d)"/g, "$1″").replace(/(\d)'(?=[\s\d″]|$)/g, "$1′")
  .replace(/(^|[\s(\[{–—])"/g, "$1“").replace(/"/g, "”").replace(/(^|[\s(\[{–—])'/g, "$1‘").replace(/'/g, "’")
  .replace(/\s--?\s/g, " – ").replace(/(^|\s)-(?=\d)/g, "$1−").replace(/\.\.\./g, "…").replace(/(\d)x(?=\s|$)/g, "$1×");

// ---- Markup. PENDING gives each section's kit label and grey shapes (.g); FILL gives its HTML once it has a value.
const g = (w, h) => `<span class="g" style="--w:${w}${h ? `;--h:${h}px` : ""}"></span>`;

  question: ["Question", ""],
  answer: ["Answer", g("48%") + g("100%") + g("56%")],
  context: ["Context", g("58%") + g("64%")],
  facts: ["Key facts", '<ol class="facts ghost">' + ["Key facts", g("64%", 22), g("48%", 22)].map(label =>
    `<li><span class="val"><b class="num">—</b></span><span class="lbl">${label}</span></li>`).join("") + "</ol>"],
  compare: ["Comparison", '<div class="top ghost"><h2>Comparison</h2></div><ol class="bars ghost" style="--lw:96px">' +
    [1, .7, .46, .26].map(p => `<li><span class="l"></span><div class="plot"><i style="--p:${p}"></i></div></li>`).join("") + "</ol>"],
  related: ["Related", '<h2 class="caps rel-h">Related</h2><ol class="rel ghost">' +
    ["74%", "58%", "66%"].map((w, i) => `<li><span class="n">${i + 1}</span>${g(w, 22)}</li>`).join("") + "</ol>"],
  sources: ["Sources", g("260px", 20)],
};
const hi = (c, i) => c.highlight.includes(i + 1) ? ' class="hi"' : "";

const caption = (title, unit) => `<div class="top"><h2>${T(title || "Comparison")}</h2>${unit ? `<p class="caps">${T(unit)}</p>` : ""}</div>`;
const FILL = {
  question: T,
  answer: a => T(a).replace(/\*(.+?)\*/, "<em>$1</em>"),
  context: T,
  facts: fs => `<ol class="facts">${fs.map(f => {
    // "12.5 min" and "3–5 days" split into numeral and unit; "$999", "42%", "2 h 30 min" and "Model B" stay whole.
    let m = f.value.match(/^([-+−~≈<>$€£¥]?\s?\d[\d.,:]*(?:[-–\/]\d[\d.,:]*)*(?:°[CFK]?|[%×"'])?)\s*(\D.*)?$/);
    if (m && /\d/.test(m[2] || "")) m = null;
    const unit = m && m[2] ? `<span class="u">${T(m[2])}</span>` : "";
    return `<li><span class="val"><b class="num">${T(m ? m[1] : f.value)}</b>${unit}</span><span class="lbl">${T(f.label)}</span></li>`;
  }).join("")}</ol>`,
  compare: c => {
    if (c.kind === "table") return caption(c.title) + "<table><thead><tr>" + c.columns.map(h => `<th scope="col"><span>${T(h)}</span></th>`).join("") +
      "</tr></thead><tbody data-tv-group>" + c.rows.map((r, i) => `<tr${hi(c, i)}${item(i + 1)}>` +
        r.map((x, j) => j ? `<td><span>${T(x)}</span></td>` : `<th scope="row"><span>${T(x)}</span></th>`).join("") + "</tr>").join("") + "</tbody></table>";
    const max = Math.max(...c.items.map(it => it.value)) || 1;
    return caption(c.title, c.unit) + '<ol class="bars" data-tv-group>' + c.items.map((it, i) =>
      `<li${hi(c, i)}${item(i + 1)}><span class="l">${T(it.label)}</span><div class="plot"><i style="--p:${(it.value / max).toFixed(4)}${it.value ? "" : ";min-width:0"}"></i>` +
      `<b class="v">${esc(nf.format(it.value))}</b></div>${it.note && hi(c, i) ? `<p class="note"><span>${T(it.note)}</span></p>` : ""}</li>`).join("") + "</ol>";
  },
  related: rs => '<h2 class="caps rel-h">Related</h2><ol class="rel" data-tv-group>' +
    rs.map((r, i) => `<li${item(i + 1)}><span class="n">${i + 1}</span><span class="t">${T(r)}</span></li>`).join("") + "</ol>",
  sources: () => '<span class="caps">Sources</span><span class="list"></span>',  // fitText writes the list
};

// ---- Views. The answer card is the only one. It redraws only the sections whose value changed.
const view = document.querySelector('[data-view="answer"]');
const main = view.querySelector(".main"), rail = view.querySelector(".rail");
const slotEl = name => view.querySelector(`[data-slot="${name}"]`);
const drawn = {}, looks = {};  // looks: each section's value without its highlight
const VIEWS = {
  answer() {
    for (const name of SLOTS) {
      const value = state[name], key = value === undefined ? "pending" : JSON.stringify(value), node = slotEl(name);
      if (drawn[name] === key) continue;
      drawn[name] = key;
      // A moved highlight redraws the chart without replaying it: the finished entrance stays and new bars do not grow.
      const look = JSON.stringify(value, (k, v) => k === "highlight" ? undefined : v), moved = look === looks[name];
      looks[name] = look;
      node.classList.remove("off", ...moved ? [] : ["enter"]);
      node.classList.toggle("held", moved);
      if (value === undefined) { tv.pending(name, PENDING[name][0]); node.insertAdjacentHTML("beforeend", PENDING[name][1]); }

    slotEl("context").classList.toggle("long", typeof state.answer === "string" && typeof state.context === "string" && state.context.length > 170);
    stage.classList.toggle("solo-status", view.classList.toggle("solo", state.compare === null && state.related === null));
    main.style.setProperty("--rows", main.children.length - 1);  // every left-column section but the facts
    view.classList.toggle("nosrc", state.sources === null);
    view.classList.toggle("nofacts", state.facts === null);
    view.classList.toggle("nochart", state.compare === null);
    fitText();
  },
};

// ---- Fit by measuring, so the wider Noto faces on the TV host still fit. Runs again when the fonts load.
let hidden = [];  // numbers of the related questions that did not fit
const pen = document.createElement("canvas").getContext("2d");  // measures one letter; nothing is drawn
const floorOf = box => box.offsetTop + box.clientHeight - parseFloat(getComputedStyle(box).paddingBottom) + 1;
function fitText() {
  const solo = view.classList.contains("solo");
  // Fact numerals share one size: the largest at which the widest value fits its column.
  const facts = slotEl("facts").querySelector(".facts:not(.ghost)");
  if (facts) {
    const vals = [...facts.querySelectorAll(".val")];
    const fits = size => { facts.style.setProperty("--fs", size + "px"); return vals.every(v => v.scrollWidth <= v.clientWidth); };
    facts.classList.remove("wrap");
    let size = solo ? 112 : 96;
    while (size > 64 && !fits(size)) size -= 4;
    if (!fits(size)) { facts.classList.add("wrap"); size = 96; while (size > 44 && !fits(size)) size -= 4; }
  }
  // The headline takes the largest size that leaves every left-column section above the Sources line: a word or two
  // as a poster line, a sentence in up to three lines, or four when long. A pending headline shrinks its shapes too.
  const a = slotEl("answer"), floor = floorOf(main);
  const inside = () => [...main.children].every(n => n.offsetTop + n.offsetHeight <= floor);
  a.style.fontSize = a.style.textIndent = "";
  if (typeof state.answer === "string") {
    const three = solo ? 196 : state.facts === null ? 152 : 136;
    const alone = !solo && state.context === null && state.facts === null;  // nothing below it: up to four lines at any size
    const lines = size => alone ? 4 : size > three * 1.7 ? 1 : size > three ? 2 : size >= 88 ? 3 : 4;
    const fits = size => { a.style.fontSize = size + "px";
      return Math.round(a.offsetHeight / (size * .98)) <= lines(size) && a.scrollWidth <= a.clientWidth + 1 && inside(); };
    // An italic first letter leans away from the margin. Hang it, so its ink starts on the margin.
    if (a.firstChild.nodeName === "EM") {

    }

    while (size > 60 && !fits(size)) size -= 4;
  } else if (state.answer === undefined) {
    for (let size = parseFloat(getComputedStyle(a).fontSize); size > 32 && !inside(); ) a.style.fontSize = (size -= 4) + "px";
  }

  const src = slotEl("sources").querySelector(".list"), all = state.sources || [];
  if (src) for (let n = all.length; n; n--) {

    if (src.scrollWidth <= src.clientWidth) break;

  const cmp = slotEl("compare"), rel = slotEl("related"), rows = [...rel.querySelectorAll(".rel li")];
  rail.classList.remove("dense", "tight", "roomy");
  rows.forEach(li => li.classList.remove("off"));
  fitChart();
  const over = () => { const last = [...rail.children].filter(n => n.offsetHeight).pop();
    return last && last.offsetTop + last.offsetHeight > floorOf(rail); };
  for (const cls of ["dense", "tight"]) if (over()) { rail.classList.add(cls); fitChart(); }
  for (let i = rows.length; i-- && over(); ) if (i + 1 !== state.selected) rows[i].classList.add("off");
  hidden = state.related ? rows.flatMap((li, i) => li.classList.contains("off") ? [i + 1] : []) : [];

  if (state.compare && !rail.classList.contains("dense") && (rel.offsetHeight ? rel.offsetTop : floorOf(rail)) - cmp.offsetTop - cmp.offsetHeight > 200) {
    rail.classList.add("roomy"); fitChart();
    if (over()) { rail.classList.remove("roomy"); fitChart(); }

}
// Bars: a label column as wide as the longest label (or labels above the bars past 230 px), and room for each value.
// Table: text from 32 down to 28 px, then the widest header or column wraps, then the next, until it fits.
// Both are measured with every row bold (.m), so moving the highlight moves no column and no axis.
function fitChart() {
  const box = slotEl("compare"), bars = box.querySelector(".bars:not(.ghost)"), table = box.querySelector("table");
  if (bars) {
    bars.classList.remove("stack");
    bars.classList.add("m");
    bars.style.setProperty("--lw", "max-content");
    const lw = Math.max(...[...bars.querySelectorAll(".l")].map(l => l.scrollWidth));
    bars.classList.toggle("stack", lw > 230);
    bars.style.setProperty("--lw", lw > 230 ? "1fr" : lw + 2 + "px");
    bars.style.setProperty("--vw", Math.max(...[...bars.querySelectorAll(".v")].map(v => v.offsetWidth)) + 20 + "px");
    bars.classList.remove("m");

    const wide = () => table.offsetWidth > box.clientWidth + 16, heads = [...table.rows[0].cells];
    table.className = "m";

      table.classList.add("wrap");
      const width = cells => Math.max(...cells.map(c => c.firstChild.offsetWidth));
      const parts = heads.flatMap((head, j) => {
        const body = [...table.tBodies[0].rows].map(r => r.cells[j]);
        head.style.setProperty("--cw", width(body) + "px");
        return [{ cells: [head], w: width([head]) }, { cells: body, w: width(body), head }];
      }).sort((x, y) => y.w - x.w);
      for (const part of parts) if (wide()) {
        part.cells.forEach(c => c.classList.add("w"));
        if (part.head) part.head.style.setProperty("--cw", 0);  // a wrapped column no longer holds its header wide

    heads.map(h => h.offsetWidth).forEach((w, j) => heads[j].style.width = w + "px");  // pin the columns

// ---- Patch handlers, run in this order. Each checks its value and changes state only.
const PATCH = {
  clear(v) {
    if (v !== true) fail("clear must be true.");
    for (const name of SLOTS) state[name] = undefined;
    state.selected = state.working = null;
  },
  demo(v) {
    if (v !== true && v !== "table") fail('demo must be true or "table".');
    const sample = SAMPLE[v === true ? "bars" : "table"];

    state.selected = state.working = null;
  },
  question(v) { state.question = v === null ? null : text("question", v, 140); },
  answer(v) {
    const s = v === null ? null : text("answer", v, 120), plain = s && s.replace(/\*/g, "");
    if (plain && plain.length > 110) fail(`answer must be at most 110 characters (got ${plain.length}). Put the detail in context.`);
    if (plain && plain.split(" ").length > 16) fail("answer must be at most 16 words (about 12 is best). Put the detail in context.");
    if (s && ![0, 2].includes(s.split("*").length - 1)) fail('answer takes one phrase between two stars, like "Mars is about *225 million* km away."');
    state.answer = s;
  },
  context(v) {
    const s = v === null ? null : text("context", v, 240);
    if (s && s.split(" ").length > 40) fail("context must be one sentence of at most 40 words.");
    state.context = s;
  },
  facts(v) {
    state.facts = v === null ? null : list("facts", v, 3, '[{"value":"12.5 min","label":"Light travel time"}]').map((f, i) =>
      isObj(f) ? { value: text(`facts[${i}].value`, f.value, 16), label: text(`facts[${i}].label`, f.label, 40) }
        : fail(`facts[${i}] must be like {"value":"12.5 min","label":"Light travel time"}.`));
  },
  compare(v) {
    if (v === null) { if (state.compare?.kind !== "table") state.compare = null; return; }  // removes a chart, not a table
    const items = list("compare.items", v?.items, 5, '[{"label":"Venus","value":118}]').map((it, i) => {
      if (!isObj(it) || !(it.value >= 0) || !Number.isFinite(it.value))
        fail(`compare.items[${i}] must be like {"label":"Mars","value":225}: a number of 0 or more, with the unit in compare.unit.`);
      return { label: text(`compare.items[${i}].label`, it.label, 32), value: it.value, note: optional(`compare.items[${i}].note`, it.note, 32) };
    });
    if (items.filter(it => it.note).length > 1) fail("compare takes a note on one item only.");
    state.compare = { kind: "bars", title: optional("compare.title", v.title, 40), unit: optional("compare.unit", v.unit, 24), items,
      highlight: v.items.flatMap((it, i) => it.highlight === true ? [i + 1] : []) };
  },
  table(v) {
    if (v === null) { if (state.compare?.kind !== "bars") state.compare = null; return; }  // removes a table, not a chart
    const ex = '{"columns":["Laptop","Weight"],"rows":[["Model A","1.4 kg"]]}';
    const columns = list("table.columns", v?.columns, 4, ex, 2).map((c, i) => text(`table.columns[${i}]`, c, 18));
    const rows = list("table.rows", v.rows, 4, ex).map((r, i) => Array.isArray(r) && r.length === columns.length
      ? r.map((c, j) => text(`table.rows[${i}][${j}]`, c, 18)) : fail(`table.rows[${i}] must be a list of ${columns.length} cells.`));
    if (v.highlight != null && !(Number.isInteger(v.highlight) && v.highlight >= 1 && v.highlight <= rows.length))
      fail(`table.highlight must be a row number from 1 to ${rows.length}, or left out.`);

  },
  highlight(v) {
    const c = state.compare || fail("highlight needs a chart or table. Send compare or table first.");
    const labels = c.kind === "bars" ? c.items.map(it => it.label) : c.rows.map(r => r[0]);
    const n = typeof v === "number" ? v : labels.findIndex(l => l.toLowerCase() === String(v).trim().toLowerCase()) + 1;
    if (v !== null && !(Number.isInteger(n) && n >= 1 && n <= labels.length))
      fail(`highlight must be one of ${labels.map(l => JSON.stringify(l)).join(", ")}, a number from 1 to ${labels.length}, or null.`);
    c.highlight = v === null ? [] : [n];
  },
  related(v) {
    const next = v === null ? null : list("related", v, 4, '["How long would a trip take?"]').map((s, i) => text(`related[${i}]`, s, 60));
    if (JSON.stringify(next) !== JSON.stringify(state.related)) state.selected = null;
    state.related = next;
  },
  selected(v) {
    const count = state.related ? state.related.length : 0;
    if (v !== null && !(Number.isInteger(v) && v >= 1 && v <= count))
      fail(count ? `selected must be a related question number from 1 to ${count}, or null.`
        : 'selected needs related questions first. Send {"related":["First question?","Second question?"]} before it or in the same patch.');
    state.selected = v;
  },
  sources(v) {
    state.sources = v === null ? null : list("sources", v, 5, '["example.org"]').map((s, i) => {
      const domain = text(`sources[${i}]`, s, 200).replace(/^[a-z][a-z0-9+.-]*:\/\//i, "").replace(/^www\./i, "").split(/[/?#\s]/)[0].toLowerCase();
      return domain && domain.length <= 64 ? domain : fail(`sources[${i}] must be a domain name like "example.org".`);
    });
  },
  working(v) {
    if (v !== null && v !== false && !(typeof v === "string" && v.trim())) fail('working must be a short status like "Checking sources", or null.');
    state.working = v ? v.trim() : null;
  },
};

// Runs every handler or none: a bad value throws and leaves the screen as it was.
function apply(patch) {
  if (!isObj(patch)) fail('apply takes one JSON object, like {"question":"How far is Mars right now?"}.');
  if (patch.compare && patch.table) fail("Send compare or table, not both. They share one place on screen.");
  const before = structuredClone(state);
  try { for (const key in PATCH) if (Object.hasOwn(patch, key)) PATCH[key](patch[key]); }
  catch (error) { Object.assign(state, before); throw error; }
  VIEWS.answer();
  // Touch the status line only when asked, so a direct tv.working() call survives later patches.
  if (Object.hasOwn(patch, "working") || patch.clear || patch.demo) state.working ? tv.working(state.working) : tv.done();
  return report(Object.keys(patch).filter(key => !Object.hasOwn(PATCH, key)));
}

// app.state() shows each filled section as short text: its text, or the text in its list or object, clipped.
// A section whose value reads badly that way gets a SUMMARY entry.
const clip = s => s.length > 60 ? s.slice(0, 59) + "…" : s;
const brief = v => clip(typeof v === "string" ? v : Object.values(v).filter(x => typeof x === "string" && x).join(" · "));
const SUMMARY = {
  facts: fs => brief(fs.map(f => f.value)),
  compare: c => brief(`${c.kind === "bars" ? "chart" : "table"}: ${c.title || "untitled"}`),
  related: rs => `${rs.length} questions, listed in related`,
};
function report(ignored = []) {
  const c = state.compare, n = c && c.highlight[0];
  return {
    view: "answer",
    shown: Object.fromEntries(SLOTS.filter(s => state[s] != null).map(s => [s, (SUMMARY[s] || brief)(state[s])])),
    pending: SLOTS.filter(s => state[s] === undefined), removed: SLOTS.filter(s => state[s] === null),
    highlight: n ? (c.kind === "bars" ? c.items[n - 1].label : c.rows[n - 1][0]) : null,
    related: (state.related || []).map((text, i) => ({ n: i + 1, text, ...(hidden.includes(i + 1) ? { hidden: true } : {}) })),
    selected: state.selected,
    working: tv.state().working,
    ...(ignored.length ? { ignored } : {}),
  };
}

// ---- Remote. The bridge's helper moves focus with the arrows and turns Enter into a click. A click runs the same
// patch as voice, then tells the agent with tv.input. One handler per slot whose items take focus (see item()).
const REMOTE = {
  related: n => { apply({ selected: n }); tv.input("ask", { item: n, question: state.related[n - 1] }); },
  compare: n => { apply({ highlight: n }); tv.input("highlight", { item: n, label: report().highlight }); },
};
view.addEventListener("click", event => {
  const el = event.target.closest("[data-n]");
  if (el) REMOTE[el.closest("[data-slot]").dataset.slot](+el.dataset.n);
});
// Nothing has focus until the first remote key, so at rest the card reads as it does without a remote. From then on
// an item keeps focus: a redrawn chart (a moved highlight) gives it back to the same bar or row, and a new list of
// questions starts again at 1. fitText calls keepFocus after every render.
let used = false, last = "";  // used: a remote key has arrived; last: the chart item that had focus
view.addEventListener("focusin", ({ target }) => last = target.closest("#cmp") ? `#cmp [data-n="${target.dataset.n}"]` : "");
function keepFocus() {
  const at = document.activeElement, shown = el => el.checkVisibility();
  if (!used || at && at.dataset.n && shown(at)) return;
  const el = [last, "#rel [data-n]", "#cmp [data-n]"].filter(Boolean).flatMap(sel => [...view.querySelectorAll(sel)]).find(shown);
  el ? el.focus({ preventScroll: true }) : last = "";
  return el;
}
addEventListener("focus", keepFocus);  // the bridge focusing this frame clears the focused item
addEventListener("keydown", event => {
  if (!/^(Arrow|Enter$)/.test(event.key)) return;
  used = true;
  if (keepFocus()) event.preventDefault();  // a press with nothing focused lands on the first item, and goes no further
}, true);

window.app = { apply, state: () => report() };
apply(new URLSearchParams(location.search).has("demo") ? { demo: true } : {});
document.fonts.ready.then(fitText);
document.fonts.addEventListener("loadingdone", fitText);
})();
</script>
</body>
