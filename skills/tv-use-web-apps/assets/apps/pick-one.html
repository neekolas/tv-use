<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Pick one</title>
<!--
  Pick one: choose between numbered options by voice. A poster wall for films, restaurants,
  trips or recipes. Each poster is drawn from its hue, so no images are needed.
  Views: grid (the wall, five posters a page), detail (one option), chosen (the pick).

  Patch keys for app.apply(patch), run in this order. Numbers are the ones on screen and run
  across pages; state().numbers maps them to ids.
    demo    {"demo": true}            load 18 sample films
    data    {"data": {"title": "Movie night", "subtitle": "Rainy Friday", "kicker": "Tonight",
              "items": [{"id": "tide", "title": "Northbound Tide", "meta": "2021 · 1h 58m",
              "tags": ["Drama"], "score": 8.4, "hue": 200, "description": "Up to 40 words.",
              "facts": [{"label": "Rated", "value": "PG-13"}]}]}}
            Only id and title are required. Up to 64 items, 2 tags, 4 facts. kicker (up to
            16 characters) sits above the chosen title. New items reset subtitle and kicker,
            unless sent with them, and all the keys below.
    remove  {"remove": ["tide"]}      drop options by id, for good
    only    {"only": "Comedy"}        show one tag; {"only": ["tide", "bloom"]} shows these ids;
            {"only": null} shows all
    sort    {"sort": "score"}         highest score first; "title" sorts A to Z; null keeps data order
    page    {"page": 2}               show page 2 of the wall
    focus   {"focus": 3}              mark number 3 on the wall; null clears it
    item    {"item": 3}               open number 3 in detail; null goes back to the wall
    chosen  {"chosen": 5}             show number 5 as the pick; null clears the pick
    view    {"view": "grid"}          "grid", "detail" or "chosen"; detail and chosen use the open or focused item

  state(): {view, ready, title, page, pages, total, numbers: {"1": "tide", ...}, focus, item,
    chosen: {id, number, title}, only, sort, removed, tags}

  Voice turns:
    "Show me what you found"        {"data": {"title": "...", "items": [...]}}
    "Tell me more about number 3"   {"item": 3}
    "Go back to all of them"        {"view": "grid"}
    "Next page"                     {"page": <state().page + 1>}
    "Only the comedies"             {"only": "Comedy"}  (a name from state().tags)
    "Clear that filter"             {"only": null}
    "Not number 2, get rid of it"   {"remove": ["<state().numbers["2"]>"]}
    "Sort them by rating"           {"sort": "score"}
    "Let's do number 5"             {"chosen": 5}

  Siri Remote, in tv_show's default "remote": "tvos". Each control runs the patch shown, as a voice turn
  would, then calls tv.input(action, detail). Read it with tv.state().input. n is the number on screen.
    Arrow onto a poster       {"focus": n}        tv.input("focus", {item: n, id})
    Select on a poster        {"item": n}         tv.input("open", {item: n, id})
    Previous, Next            {"page": p}         tv.input("page", {page: p})
    Pick this (detail)        {"chosen": n}       tv.input("pick", {item: n, id})
    Back (detail)             {"view": "grid"}    tv.input("back", {item: n, id})
    Change pick (chosen)      {"chosen": null}    tv.input("change", {item: n, id})
  Down from any poster goes to the pager. Focus follows the state: the focused poster on the wall,
  Pick this when detail opens, Change pick on the chosen card.
-->
<style>
  /* ---------- Tokens ---------- */
  @font-face { font-family: "Instrument Serif"; src: url(fonts/instrument-serif.woff2) format("woff2"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Instrument Serif"; src: url(fonts/instrument-serif-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Inter"; src: url(fonts/inter.woff2) format("woff2"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Newsreader"; src: url(fonts/newsreader-italic.woff2) format("woff2"); font-weight: 200 800; font-style: italic; }
  /* Digits in the serif come from Newsreader. Its 1 has a flag and a foot; Instrument Serif's is a bare stroke. */
  @font-face { font-family: "Instrument Serif"; src: url(fonts/newsreader.woff2) format("woff2"); font-weight: 400; font-style: normal; unicode-range: U+30-39; }
  @font-face { font-family: "Instrument Serif"; src: url(fonts/newsreader-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; unicode-range: U+30-39; }
  :root { --bg: #0e0c0a; --text: #f3ede1; --muted: #b9af9f; --rule: #2f2922; --ghost: #1b1713; --accent: #ffc247;
    --fall: "Iowan Old Style", Georgia, "Times New Roman", "Noto Serif", system-ui;
    --serif: "Instrument Serif", var(--fall); --quote: "Newsreader", var(--fall);
    --sans: "Inter", "Noto Sans", system-ui; --ease: cubic-bezier(.2, .7, .2, 1); }

  /* ---------- Layout ---------- */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    background: var(--bg); color: var(--text); font: 500 32px/1.3 var(--sans); font-synthesis: none;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  h1, p, ol, dl, dd, blockquote { margin: 0; padding: 0; }
  ol { list-style: none; }
  .p-tags span, .top p, #title, .slot .m, .crumb .caps, #detail-meta, .facts dt, .facts dd, .lb p, #chosen-meta {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caps { font: 600 28px/1.25 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  /* A wash of the current poster's hue in two corners. */
  #ambient { position: absolute; inset: 0; --h: 30; transition: opacity 300ms var(--ease);
    background: radial-gradient(1500px 900px at 8% -20%, hsl(var(--h) 46% 24% / .5), transparent 72%),
      radial-gradient(1200px 800px at 108% 118%, hsl(var(--h) 40% 18% / .4), transparent 70%); }
  #ambient.dim { opacity: .4; }
  [data-view] { position: absolute; inset: 60px 80px; opacity: 0; visibility: hidden;
    transition: opacity 280ms var(--ease), visibility 0s 280ms; }
  [data-view].on { opacity: 1; visibility: visible; transition: opacity 280ms var(--ease), visibility 0s; }

  /* Poster: 20em by 30em, colored by --field, --ink, --ink2, --type and --credit. */
  .poster { position: relative; width: 20em; height: 30em; overflow: hidden; background: var(--field); color: var(--type); }
  .poster svg, .emblem svg { position: absolute; left: 0; top: 5.8em; width: 20em; height: 12.8em; }
  .a { fill: var(--ink); } .b { fill: var(--ink2); } .f { fill: var(--field); }
  .s { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  .p-init { position: absolute; left: 0; right: 0; top: 5.2em; height: 13.4em; overflow: hidden; text-align: center;
    color: var(--ink); }
  .p-init b { font: italic 400 15em/.96 var(--serif); }
  .p-tags { position: absolute; left: 1.2em; right: 1.2em; top: 1.15em; color: var(--credit); }
  .p-tags span { display: block; font: 600 1.71em/1.22 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
  .p-title { position: absolute; left: 1.2em; right: 1.2em; bottom: .55em; height: 11em; display: flex; align-items: flex-end; }
  .tt { display: block; width: 100%; padding-bottom: .14em; font: 400 4.4em/.98 var(--serif); letter-spacing: -.012em; }
  .tt.sm { font-weight: 600; letter-spacing: 0; }
  /* A title that fits at no size breaks long words and stops at three lines. No padding, or a fourth line shows in it. */
  [data-fit] { hyphens: none; }
  .brk { overflow-wrap: anywhere; hyphens: manual; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  :is(.tt, #detail-title, #chosen-title).brk { padding-bottom: 0; line-height: 1.06; }
  /* Accents need more room between lines. Letters the bundled serif lacks put the whole title in the fallback serif. */
  :is(.tt, #detail-title, #chosen-title).acc { line-height: 1.04; }
  :is(.tt, #title, #detail-title, #chosen-title).alt { font-family: var(--fall); letter-spacing: 0; }
  :is(.tt, #detail-title, #chosen-title).alt { line-height: 1.12; }
  /* Buttons. The remote's helper rings, lifts and shades the focused one; the accent fill is ours. */
  button { margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: inherit; outline: none; }
  .btn { flex: none; height: 64px; padding: 0 30px 0 34px; border-radius: 32px; background: #241e18; color: var(--text);
    font: 600 28px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .btn:focus { background: var(--accent); color: #16120e; }
  .btn:disabled { opacity: .3; }

  /* ---------- Grid ---------- */
  .top { display: flex; justify-content: space-between; gap: 80px; height: 36px; }
  #count { flex: none; max-width: 1240px; }
  #count i { display: inline-block; width: 18px; height: 18px; margin-right: 18px; background: var(--accent); }
  #count b { font-weight: 600; color: var(--text); }
  #title { margin-top: -6px; height: 164px; font: italic 400 128px/164px var(--serif); letter-spacing: -.018em; }
  #title.brk { display: block; }
  #title.tv-pending { color: #8f8677; }
  #title.tv-pending::after, #subtitle.tv-pending::after { display: none; }
  /* The wall leaves room above for a poster the remote lifts, clear of the title's descenders. */
  .wall { position: absolute; left: 0; top: 234px; display: flex; gap: 30px; }
  .slot { position: relative; width: 328px; font-size: 16.4px; }
  /* The poster is the focusable button. Its transition outranks the helper's, so it lists scale too. */
  .slot .pb { position: relative; display: block; transition: transform 240ms var(--ease), scale 240ms var(--ease); }
  /* A soft light falls across the poster the remote focuses, and stays under its title. */
  .pb::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 240ms var(--ease);
    background: linear-gradient(155deg, rgb(255 255 255 / .18), rgb(255 255 255 / 0) 48%); }
  .pb:focus::after { opacity: 1; }
  /* Posters beside the focused one dim under a wash. Their titles sit above it and stay at full strength. */
  .slot .poster::after { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: 0; transition: opacity 240ms var(--ease); }
  .slot .p-title { z-index: 1; }
  .slot .mark { position: relative; z-index: 2; display: block; height: 8px; margin-top: 12px; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%;
    transition: transform 240ms var(--ease); }
  .cap { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; height: 78px; }
  .cap .n { font: 400 74px/78px var(--serif); letter-spacing: -.02em; transition: color 240ms; }
  .cap .sc { display: flex; align-items: center; gap: 10px; font: 700 32px/1 var(--sans); font-variant-numeric: tabular-nums; }
  .cap .sc svg { width: 24px; height: 24px; color: var(--muted); }
  .slot .m { height: 36px; letter-spacing: .08em; }
  .slot .m.pick { color: var(--accent); }
  .slot .m.pick i { display: inline-block; width: 16px; height: 16px; margin-right: 14px; background: var(--accent); }
  .wall.has-focus .slot:not(.focus) .poster::after { opacity: .42; }
  .slot.focus .pb { transform: translateY(-14px); }
  .slot.focus .mark { transform: none; }
  .slot.focus .n { color: var(--accent); }
  .ghost .poster { background: var(--ghost); }
  .ghost .p-init { top: 7em; color: #332c24; }
  .ghost .p-init b { font-style: normal; font-size: 11.6em; line-height: 1.24; }
  .ghost .cap i { align-self: center; width: 56px; height: 6px; background: var(--rule); }
  .ghost .m { margin-top: 14px; width: 190px; height: 6px; background: var(--ghost); }
  .aside { position: absolute; right: 0; padding-right: 10px; top: 234px; height: 492px; display: flex; flex-direction: column;
    justify-content: flex-end; text-align: right; }
  .aside b { font: italic 400 168px/.9 var(--serif); letter-spacing: -.02em; white-space: nowrap; display: block; }
  .aside.fin b { color: #6f675b; font-size: 120px; }
  .aside span { margin-top: 18px; }
  .empty { width: 1760px; margin-top: 150px; white-space: nowrap; }
  .empty b { display: block; padding-bottom: .1em; font: 400 148px/1 var(--serif); letter-spacing: -.02em; }
  .empty b i { color: var(--accent); }
  .empty .mark { display: block; width: 328px; height: 8px; margin-bottom: 44px; background: var(--accent); }
  .empty span { display: block; margin-top: 36px; }
  .pager { position: absolute; right: 0; bottom: 0; display: flex; align-items: center; gap: 28px; height: 64px; }
  .pager[hidden] { display: none; }
  #pages { display: contents; }
  .pager b { color: var(--text); font-weight: 600; }
  .segs { display: flex; gap: 8px; }
  .segs i { width: 44px; height: 6px; background: #3a342c; }
  .segs i.on { background: var(--accent); }

  /* ---------- Detail ---------- */
  #detail-art { position: absolute; left: 0; top: 16px; font-size: 27.5px; }
  .info { position: absolute; left: 650px; right: 0; top: 16px; height: 825px; display: flex; flex-direction: column; }
  /* The buttons sit under the text column, clear of the status line at the bottom left. */
  .acts { position: absolute; left: 650px; top: 881px; display: flex; gap: 24px; }
  .info > * { flex: none; }
  .info.bare { justify-content: center; }
  .info.bare .lower { display: none; }
  .crumb { display: flex; align-items: baseline; gap: 26px; height: 84px; }
  .crumb .n, .crumb .score b { font: 400 92px/84px var(--serif); letter-spacing: -.02em; }
  .crumb .n { color: var(--accent); }
  .crumb > .caps { flex: 1; min-width: 0; margin-right: 40px; }
  .crumb .score { display: flex; align-items: baseline; gap: 22px; }
  .crumb .score[hidden] { display: none; }
  .t-box { margin-top: 36px; max-height: 268px; }
  #detail-title { padding-bottom: .12em; font: 400 176px/.96 var(--serif); letter-spacing: -.022em; }
  #detail-meta { margin-top: 8px; }
  /* The quote starts 96 px under the meta line and the facts end level with the poster. The first row is the
     spare part of that gap: it closes when a long title leaves no room. */
  .lower { flex: 1 1 0; min-height: 0; margin-top: 36px; display: grid; grid-template: minmax(0, 60px) 1fr / 1fr 350px; column-gap: 60px; }
  .lower.nofacts, .lower.noquote { grid-template-columns: 1fr; }
  .q { position: relative; grid-row: 2; align-self: start; }
  .facts { grid-row: 2; align-self: end; }
  .q::before { content: "\201C"; position: absolute; right: 100%; margin-right: 14px; top: -6px; font: 400 132px/1 var(--serif); color: var(--accent); }
  .desc { font: italic 500 40px/54px var(--quote); font-variation-settings: "opsz" 40; color: #ebe4d6;
    max-height: 378px; overflow: hidden; }
  /* Shorter quotes are set larger, so the block stays about as tall as the facts beside it. */
  .desc.mid { font-size: 46px; line-height: 60px; max-height: 360px; }
  .desc.big { font-size: 56px; line-height: 72px; max-height: 360px; }
  .lower.nofacts .q { max-width: 900px; }
  .lower.noquote .q, .facts:empty { display: none; }
  .facts div { padding: 10px 0 12px; border-top: 3px solid var(--rule); }
  .facts div:last-child { padding-bottom: 0; }
  .facts dt { line-height: 32px; }
  .facts dd { font: 600 34px/38px var(--sans); }
  .facts dd.wrap { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .lower.noquote .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 70px; }

  /* ---------- Chosen: a letterboxed title card ---------- */
  [data-view=chosen] { inset: 0; background: var(--bg); }
  .band { position: absolute; left: 0; right: 0; top: 150px; height: 780px; overflow: hidden; background: var(--field); }
  .emblem { position: absolute; right: -24px; top: -147px; font-size: 44px; width: 20em; height: 30em; }
  .emblem svg { overflow: visible; }
  .emblem .p-init { top: 4.6em; height: 16.4em; }
  .lb { position: absolute; left: 80px; right: 80px; display: flex; justify-content: space-between; gap: 80px; }
  .lb.t { top: 60px; } .lb.b { bottom: 60px; justify-content: flex-end; align-items: center; gap: 48px; }
  .lb b { color: var(--accent); font-weight: 600; }
  /* The text column stops before the emblem, which starts at about 1000px. */
  .ct { position: absolute; left: 80px; top: 0; bottom: 0; width: 880px; display: flex; flex-direction: column; justify-content: center; }
  #chosen-kicker { font: italic 400 104px/1 var(--serif); color: var(--accent); }
  .c-box { margin-top: 18px; max-height: 424px; }
  #chosen-title { padding-bottom: .12em; font: 400 208px/.95 var(--serif); letter-spacing: -.024em; color: var(--type); }
  #chosen-meta { margin-top: 14px; color: var(--credit); }
  #chosen-meta:empty { display: none; }
</style>
<body>
<div id="stage">
  <div id="ambient"></div>

  <section data-view="grid" aria-labelledby="title">
    <header>
      <div class="top"><p id="count" class="caps"></p><p id="subtitle" class="caps" data-slot="subtitle"></p></div>
      <h1 id="title" data-slot="title" data-fit="128px,112px,96px,80px"></h1>
    </header>
    <ol id="wall" class="wall" data-tv-group></ol>
    <div id="aside"></div>
    <nav id="pager" class="pager caps" aria-label="Pages" data-tv-group hidden>
      <button class="btn" id="prev">Previous</button><span id="pages"></span><button class="btn" id="next">Next</button></nav>
  </section>

  <section data-view="detail" aria-labelledby="detail-title">
    <div id="detail-art"></div>
    <article class="info" id="detail-info">
      <p class="crumb"><span class="n" id="detail-number"></span><span class="caps" id="detail-crumb"></span>
        <span class="score" id="detail-score"><span class="caps">Score</span><b></b></span></p>
      <div class="t-box"><h1 id="detail-title" data-fit="176px,152px,128px,108px,88px,72px"></h1></div>
      <p id="detail-meta" class="caps"></p>
      <div class="lower" id="detail-lower">
        <blockquote class="q"><p id="detail-desc" class="desc"></p></blockquote>
        <dl id="detail-facts" class="facts"></dl>
      </div>
    </article>
    <div class="acts" id="detail-acts" data-tv-group>
      <button class="btn" id="pick">Pick this</button><button class="btn" id="back">Back</button></div>
  </section>

  <section data-view="chosen" aria-labelledby="chosen-title">
    <div class="lb t"><p class="caps" id="chosen-program"></p><p class="caps" id="chosen-number"></p></div>
    <div class="band" id="chosen-band">
      <div class="emblem" id="chosen-art"></div>
      <div class="ct">
        <p id="chosen-kicker"></p>
        <div class="c-box"><h1 id="chosen-title" data-fit="208px,176px,152px,128px,104px,88px,72px"></h1></div>
        <p id="chosen-meta" class="caps"></p>
      </div>
    </div>
    <div class="lb b" data-tv-group><p class="caps" id="chosen-tags"></p><button class="btn" id="change">Change pick</button></div>
  </section>
</div>
<script>
  const stage = document.getElementById("stage");
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
  new ResizeObserver(fit).observe(document.documentElement);
</script>
<!-- tv-kit:start v2 — copy this block unchanged into every TV app, just before </body>. -->
<style>
  #tv-status { position: absolute; left: 80px; bottom: 60px; z-index: 50; display: flex; align-items: center; gap: 18px;
    padding: 14px 28px 14px 22px; border-radius: 40px; background: rgba(20, 23, 31, .92); color: #c9ccd6;
    font: 500 32px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity 250ms; }
  #tv-status[hidden] { display: flex; opacity: 0; }
  #tv-status i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent, #5b8cff);
    animation: tv-beat 2s steps(2, jump-none) infinite; }
  @keyframes tv-beat { from { opacity: 1; } to { opacity: .3; } }
  [data-slot].tv-pending { color: #8a8e9a; }
  [data-slot].tv-pending::after { content: ""; display: block; width: min(60%, 900px); height: 28px; margin-top: 14px;
    border-radius: 14px; background: #262a34; }
</style>
<script>
  (() => {
    const host = document.getElementById("stage") || document.body;
    const status = document.createElement("div");
    status.id = "tv-status";
    status.setAttribute("role", "status");
    status.hidden = true;
    status.innerHTML = "<i></i><span></span>";
    host.append(status);
    const slot = name => {
      let el = document.querySelector(`[data-slot="${CSS.escape(name)}"]`);
      if (!el) {
        const list = document.querySelector("[data-slots]");
        if (!list) throw new Error(`No element has data-slot="${name}". Use one of: ` +
          [...document.querySelectorAll("[data-slot]")].map(e => e.dataset.slot).join(", "));
        el = document.createElement("section");
        el.dataset.slot = name;
        list.append(el);
      }
      return el;
    };
    // What the person at the TV did with the remote, newest last. The agent reads it with tv.state().input.
    const inputs = [];
    const state = () => ({
      working: status.hidden ? null : status.lastChild.textContent,
      pending: [...document.querySelectorAll("[data-slot].tv-pending")].map(el => el.dataset.slot),
      input: { count: inputs.length ? inputs[inputs.length - 1].n : 0, last: inputs[inputs.length - 1] || null, recent: inputs.slice(-5) },
    });
    window.tv = {
      working(text) { status.lastChild.textContent = String(text); status.hidden = false; return state(); },
      pending(name, label = "") { const el = slot(name); el.classList.add("tv-pending"); el.textContent = label; return state(); },
      fill(name, html) { const el = slot(name); el.classList.remove("tv-pending"); el.innerHTML = html; return state(); },
      done() { status.hidden = true; return state(); },
      // Call when the person acts with the remote, e.g. tv.input("pick", {item: 3}).
      input(action, detail = null) {
        inputs.push({ n: (inputs.length ? inputs[inputs.length - 1].n : 0) + 1, action: String(action), detail, at: Date.now() });
        if (inputs.length > 20) inputs.shift();
        return state();
      },
      state,
    };
  })();
</script>
<!-- tv-kit:end -->
<script>
// Sample films, all invented. Each item is {id, title, meta, tags, score, hue, description, facts}.
const film = (id, title, year, time, tags, score, hue, rated, mood, best, description) =>
  ({ id, title, meta: `${year} · ${time}`, tags, score, hue, description,
    facts: [{ label: "Runtime", value: time }, { label: "Rated", value: rated }, { label: "Mood", value: mood }, { label: "Best with", value: best }] });

    const tags = raw.tags ?? [], facts = raw.facts ?? [], description = text(raw.description, at + ".description");
    if (!Array.isArray(tags) || tags.length > 2) fail(`${at}.tags must be an array of up to 2 short words, such as ["Comedy","Family"].`);
    if (!Array.isArray(facts) || facts.length > 4 || !facts.every(isObj))
      fail(`${at}.facts must be an array of up to 4 objects like {"label":"Runtime","value":"1h 52m"}.`);
    if (description.split(/\s+/).length > 40) fail(`${at}.description has more than 40 words. Send 40 or fewer.`);
    let score = raw.score ?? null, hue = raw.hue ?? seed(id) % 360;
    if (typeof score === "number" && isFinite(score)) score = score.toFixed(places);
    else if (typeof score === "string" && score.trim().length <= 6) score = score.trim() || null;
    else if (score !== null) fail(`${at}.score must be a number or short text such as 8.4 or "92%", or null.`);
    if (typeof hue !== "number" || !isFinite(hue)) fail(`${at}.hue must be a number from 0 to 360, such as 210.`);
    return { id, title, meta: text(raw.meta, at + ".meta"), description, score, n,
      hue: (Math.round(hue) % 360 + 360) % 360,
      tags: tags.map(t => text(t, at + ".tags")).filter(Boolean),
      facts: facts.map(f => ({ label: text(f.label, at + ".facts"), value: text(f.value, at + ".facts") })).filter(f => f.label && f.value) };
  });
}
function readNumber(v, key) {
  const list = visible();
  if (!Number.isInteger(v) || v < 1 || v > list.length)
    fail(`${key} must be a number from 1 to ${list.length}, as shown on screen.`);
  return list[v - 1].id;
}
function readIds(v, key) {
  if (!Array.isArray(v) || !v.length) fail(`${key} takes an array of item ids, such as {"${key}": ["tide"]}` +
    (key === "only" ? ', or one tag, such as {"only": "Comedy"}.' : "."));
  const ids = v.map(String);
  for (const id of ids) if (!byId(id))
    fail(`${key}: "${id}" is not an item id. Map numbers to ids first; on screen now: ${JSON.stringify(snapshot().numbers)}.`);
  return ids;
}

// Open one item in the detail or chosen view.
function show(id, view) {
  state.item = state.focus = id;
  state.page = pageOf(id);
  if (view === "chosen") state.chosen = id;
  state.view = view;
}
// After the list changes, show the wall at the focused poster's page, or page 1.
function backToWall() {
  state.page = numberOf(state.focus) ? pageOf(state.focus) : 1;
  state.view = "grid";
}

// ---------- Patch handlers: one per key, in the order they run ----------
const PATCH = {
  demo(v) {
    if (v === false) return;
    if (v !== true) fail('demo must be true, as in {"demo": true}.');
    PATCH.data(SAMPLE);
  },
  data(d) {
    if (!isObj(d)) fail('data must be an object like {"title":"Movie night","items":[{"id":"a","title":"First option"}]}.');
    for (const key in d) if (!["title", "subtitle", "kicker", "items"].includes(key)) ignored.push("data." + key);
    // A new list starts clean, so an old subtitle or kicker never sits over new items.
    if ("items" in d) Object.assign(state, { items: readItems(d.items), ready: true, subtitle: "", kicker: "Tonight",
      removed: [], only: null, sort: null, page: 1, focus: null, item: null, chosen: null, view: "grid" });
    if ("title" in d) state.title = text(d.title, "data.title");
    if ("subtitle" in d) state.subtitle = text(d.subtitle, "data.subtitle");
    if ("kicker" in d) state.kicker = text(d.kicker, "data.kicker") || "Tonight";
    if (state.kicker.length > 16) fail('data.kicker must be 16 characters or fewer, such as "Tonight".');
  },
  remove(v) {
    for (const id of readIds(v, "remove")) if (!state.removed.includes(id)) state.removed.push(id);
  },
  only(v) {
    if (typeof v === "string") {
      const tag = allTags().find(t => t.toLowerCase() === v.trim().toLowerCase());
      if (!tag) fail(`No option has the tag "${v}". Tags: ${allTags().join(", ")}.`);
      state.only = tag;
    } else state.only = v === null ? null : readIds(v, "only");
    backToWall();
  },
  sort(v) {
    if (![null, "score", "title"].includes(v)) fail('sort must be "score", "title" or null.');
    state.sort = v;
    backToWall();
  },
  page(v) {
    if (!Number.isInteger(v) || v < 1 || v > pages()) fail(`page must be a number from 1 to ${pages()}.`);
    state.page = v;
    if (state.focus && pageOf(state.focus) !== v) state.focus = null;
    state.view = "grid";
  },
  focus(v) {
    state.focus = v === null ? null : readNumber(v, "focus");
    if (state.focus) state.page = pageOf(state.focus);
    state.view = "grid";
  },
  item(v) {
    if (v !== null) return show(readNumber(v, "item"), "detail");
    state.item = null;
    state.view = "grid";
  },
  chosen(v) {
    if (v !== null) return show(readNumber(v, "chosen"), "chosen");
    state.chosen = null;
    state.view = "grid";
  },
  view(v) {
    if (!["grid", "detail", "chosen"].includes(v)) fail('view must be "grid", "detail" or "chosen".');
    const id = state.item || state.focus;
    if (v === "grid") state.view = "grid";
    else if (numberOf(id)) show(id, v);
    else fail(`view "${v}" needs an item. Send {"item": 3, "view": "${v}"}.`);
  },
};

let ignored = [];  // unknown keys found by the current apply
function apply(patch) {
  if (!isObj(patch)) fail('apply takes an object, such as {"item": 3} or {"demo": true}.');
  ignored = Object.keys(patch).filter(key => !Object.hasOwn(PATCH, key));
  const before = structuredClone(state);
  try {
    for (const key in PATCH) {
      if (!Object.hasOwn(patch, key)) continue;
      if (!state.ready && !["demo", "data", "view"].includes(key))
        fail(`There are no options yet, so "${key}" cannot apply. Send {"data": {"items": [...]}} or {"demo": true} first.`);
      PATCH[key](patch[key]);
    }
  } catch (error) {
    Object.assign(state, before);  // a failed patch changes nothing
    throw error;
  }
  // Keep every id pointing at a visible item.
  for (const key of ["focus", "item"]) if (!numberOf(state[key])) state[key] = null;
  if (state.removed.includes(state.chosen)) state.chosen = null;
  if (state.view === "chosen" && state.item !== state.chosen) state.view = "detail";
  if (!state.item) state.view = "grid";
  if (state.view === "grid") state.item = null;  // item is the one open in detail or chosen
  state.page = Math.min(state.page, pages());
  render();
  return { ignored, ...snapshot() };
}

function snapshot() {
  const numbers = {}, first = (state.page - 1) * PER_PAGE, pick = byId(state.chosen);
  onPage().forEach((item, i) => { numbers[first + i + 1] = item.id; });
  return { view: state.view, ready: state.ready, title: state.title, page: state.page, pages: pages(), total: visible().length,
    numbers, focus: numberOf(state.focus) || null, item: numberOf(state.item) || null,
    chosen: pick ? { id: pick.id, number: numberOf(pick.id) || null, title: pick.title } : null,
    only: state.only, sort: state.sort, removed: state.removed, tags: allTags() };
}

window.app = { apply, state: snapshot };

// ---------- Remote: each control runs the patch a voice turn would send, then reports it ----------
function remote(action, patch, id) {
  apply(patch);
  tv.input(action, id ? { item: numberOf(id) || null, id } : patch);
}
// The pager button that works: Next, or Previous on the last page.
const pagerButton = () => $("next").disabled ? $("prev") : $("next");
// Remote focus follows the state: the focused poster, Pick this on a new detail, Change pick. Focus in
// the pager stays there, moving off a button that turned off; otherwise the next arrow starts top left.
function refocus() {
  const now = document.activeElement;
  const to = state.view === "chosen" ? $("change")
    : state.view === "detail" ? ($("detail-acts").contains(now) ? now : $("pick"))
    : state.focus ? $("wall").querySelector(`[data-id="${CSS.escape(state.focus)}"] .pb`)
    : !$("pager").hidden && $("pager").contains(now) && (now.disabled ? pagerButton() : now);
  if (to) to.focus({ preventScroll: true }); else now.blur();
}
const slotId = event => event.target.closest(".slot")?.dataset.id;
$("wall").addEventListener("focusin", e => { const id = slotId(e); if (id && id !== state.focus) remote("focus", { focus: numberOf(id) }, id); });
$("wall").addEventListener("click", e => { const id = slotId(e); if (id) remote("open", { item: numberOf(id) }, id); });
// Down from any poster goes to the pager, even from posters far left of its buttons.
$("wall").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" || $("pager").hidden) return;
  e.preventDefault();
  pagerButton().focus();
});
$("prev").addEventListener("click", () => remote("page", { page: state.page - 1 }));
$("next").addEventListener("click", () => remote("page", { page: state.page + 1 }));
$("pick").addEventListener("click", () => remote("pick", { chosen: numberOf(state.item) }, state.item));
$("back").addEventListener("click", () => remote("back", { view: "grid" }, state.item));
$("change").addEventListener("click", () => remote("change", { chosen: null }, state.chosen));

tv.pending("title", "Finding options");
render();
// Titles are fitted by measuring, so fit again as each bundled font arrives.
for (const font of ['400 72px "Instrument Serif"', 'italic 400 72px "Instrument Serif"', '600 28px "Inter"', 'italic 500 40px "Newsreader"'])
  document.fonts.load(font, "a1").then(() => fitAll(document), () => {});
if (/[?&]demo\b/.test(location.search)) apply({ demo: true });
</script>
</body>
</html>
