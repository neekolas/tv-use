<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Home board</title>
<!-- Home board: a calm room display that stays up for hours. A large clock, the weather as a temperature
     curve, the day's agenda as a timeline, notes, and one quiet row of home status. The clock and date come
     from the page. Everything else arrives by patch. A section that changes fades in.

     The app fetches nothing. Each section comes from one source that you read first:
       weather <- the weather forecast   agenda <- today's calendar   notes <- reminders or the to-do list
       status  <- home states: locks, doors, garage, temperature, appliances
     A section you have not sent shows a pending phrase ("Forecast on its way", "Reading the calendar",
     "Gathering notes", "Checking on the house"). Send real values only. If you cannot read a source, leave its
     key out, send the others, and tell the user which sources you could not read. If you can read none, still
     send {"dim":false}: it brings the board up undimmed, invents nothing, and unsent sections stay pending. Never send {}: it
     changes nothing, so app.apply refuses it. Never copy the sample values in this comment or in SAMPLE: they
     are made up. Send {"demo":true} only when the user asks for a demo.

     app.apply(patch) -> app.state(). Keys left out keep their value. A patch with one bad value throws and
     changes nothing. null sets weather, agenda, notes or status back to pending. A field with ? is optional.
       demo        {"demo":true}                            sample data, timed from the current hour (also ?demo in the URL)
       title       {"title":"The Lake House"}               null brings back the greeting
       timezone    {"timezone":"America/Chicago"}           IANA name; null uses the system zone
       dim         {"dim":true}                             dims the board for the night; false undoes it
       weather     {"weather":{"now":{"temp":48,"condition":"Partly cloudy","high":54,"low":41},"hours":[{"time":"9 PM","temp":46,"condition":"Cloudy"}],"unit":"F"}}
                   now {temp?, condition?, high?, low?} merges field by field; a field set to null is cleared (temp
                   null hides the big number). hours [{time, temp, condition?}] replaces; 6 show. unit "F" or "C".
                   condition is plain words ("Rain") or an HA state ("rainy"); both show "Rain".
       agenda      {"agenda":[{"time":"7:00 PM","title":"Family dinner","where":"Kitchen","now":true}]}
                   [{time, title, where?, now?}] replaces the list. Today only. time is "8:15 PM" or "20:15".
                   Mark the event on now, or else the next one, with "now": true. 4 rows show, from that one.
       notes       {"notes":["Library books are due Friday"]}   replaces the list; 3 show; [] shows "Nothing to remember"
       status      {"status":[{"label":"Front door","value":"Locked"},{"label":"Laundry","value":"Done","alert":true}]}
                   [{label, value, alert?}] replaces the row; up to 5 show. alert is false unless sent. Use it for
                   what needs doing (unlocked, open, done). The first alert goes first, in amber.
       add_event   {"add_event":{"time":"8:15 PM","title":"Pick up dry cleaning"}}   adds one agenda item in time order
       add_note    {"add_note":"Call Mom"}                  puts one note first
       set_status  {"set_status":{"label":"Garage","value":"Open","alert":true}}   replaces the item with that label, or adds it, and puts it first
       updated_at  {"updated_at":"2026-11-20T18:10:00Z"}     optional; leave it out unless the data was read earlier

     Rules:
       - add_event, add_note and set_status never make a copy. The same time and title, the same note, or the same
         status label (any letter case) is there once. Sending the same patch twice is safe.
       - Each section a patch changes is stamped with updated_at, or with now. Old data shows its age ("as of 6:10 PM",
         or "as of Thu 11:10 PM" from before 4 AM today) after 30 minutes for weather and status, and after 6 hours
         for agenda and notes.
       - "tonight" and "this evening" mean PM. "this morning" means AM.
       - When the user corrects themselves ("A... no, B"), send only B.

     Voice turns:
       "Put the home board up"         -> read all four sources, then send what you read in one patch, shaped like this
                                          (the values come from your reads, not from here):
         {"weather":{"now":{"temp":48,"condition":"Partly cloudy","high":54,"low":41},"unit":"F",
                     "hours":[{"time":"8 PM","temp":47,"condition":"Cloudy"},{"time":"9 PM","temp":45,"condition":"Rain"}]},
          "agenda":[{"time":"7:00 PM","title":"Family dinner","where":"Kitchen","now":true},{"time":"8:30 PM","title":"Call Grandma"}],
          "notes":["Library books are due Friday","Water the fern"],
          "status":[{"label":"Front door","value":"Locked"},{"label":"Laundry","value":"Done","alert":true}]}
                                          If you could read no source: {"dim":false}, and tell the user which ones failed.
       "Show me a demo"                -> {"demo":true}
       "It's raining now, 46 degrees"  -> {"weather":{"now":{"temp":46,"condition":"Rain"}}}
       "Add dentist at 4:30 tomorrow... no, add 'Pick up dry cleaning' at 8:15 tonight"
                                       -> {"add_event":{"time":"8:15 PM","title":"Pick up dry cleaning"}}
       "Remind me to call Mom"         -> {"add_note":"Call Mom"}
       "Clear the reminders"           -> {"notes":[]}
       "The laundry is done"           -> {"set_status":{"label":"Laundry","value":"Done","alert":true}}
       "The garage is open"            -> {"set_status":{"label":"Garage","value":"Open","alert":true}}
       "It's late, dim the board"      -> {"dim":true}           "Brighten it"  -> {"dim":false}

     Remote: tv_show uses "remote":"tvos" by default. At rest nothing has focus and the board looks as it does without a
     remote. The first arrow press focuses the first note, or else the alert. Up and Down move through the notes;
     Down from the notes, or Right along the home row, reaches Dim. 30 s after the last press, focus leaves again.
     Each action runs the patch below and keeps the section's age, then calls tv.input. Read it with tv.state().input.
       A note          Select crosses it off, then removes it: {"notes": the list without it}  -> tv.input("done", {note})
       The amber alert Select acknowledges it: {"set_status": the item with "alert":false}     -> tv.input("ack", {label})
                       Act on it if you can, like closing the garage. Keep its alert false until its value changes.
       Dim / Brighten  shown only while the remote is in use. Select toggles {"dim": ...}      -> tv.input("dim", {dim})

     Script order: SAMPLE, state, helpers, chart(), SECTION (the HTML for each data-slot), VIEWS.board,
     value checks (str, num, bool, list, obj), PATCH, apply, window.app, REMOTE. To add a patch key, for example "key":
       1. A key line above with an example and what null does, and a voice turn.
       2. state.key = null in state (null while unknown), and a value in SAMPLE: demo runs PATCH[k](SAMPLE[k]) for each.
       3. A PATCH handler named after the key. It checks the value with str(), num() or bool() and changes state only:
            key(v) { state.key = v == null ? null : str(v, "key", '"an example"'); },
          It may throw at any point: apply() then undoes the whole patch.
       4. Draw it in VIEWS.board, hidden when null. Report it in app.state(): key: state.key.
     The head column is full. A new line under the date goes in #sub, which makes room for itself. In VIEWS.board:
            $("sub").hidden = state.key == null; if (state.key != null) show($("sub"), esc(state.key));
     Render with preview.py and check that blocks keep 32px between them. The board moves up to 3px against
     burn-in, so content starts 84px from the sides and 64px from the top and bottom. -->
<style>
  /* Tokens. --hi for the current item, --text for words, --soft for labels. */
  @font-face { font-family: "Inter"; src: url(fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Fraunces"; font-style: italic; src: url(fonts/fraunces-italic.woff2) format("woff2"); font-weight: 100 900; }
  :root { --bg: #0a0d10; --ink: #0f1419; --hi: #dfe3e3; --text: #b8bfc2; --soft: #9da6ab; --rule: #242d34; --accent: #e0a96c;
    --sans: "Inter", "Noto Sans", system-ui; --serif: "Fraunces", Georgia, "Noto Serif", system-ui; }

  /* Layout. #stage clips, so the burn-in shift cannot make the page scroll when the remote moves focus. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: clip;
    color: var(--text); font: 500 34px/1.3 var(--sans);
    background: radial-gradient(1500px 950px at 20% 24%, #18212a, rgba(24, 33, 42, 0) 72%),
      radial-gradient(1000px 520px at 22% 104%, rgba(224, 169, 108, .075), rgba(224, 169, 108, 0) 70%),
      linear-gradient(160deg, #10161b, var(--bg)); }
  /* The status line is a quiet sentence in the home row's place, not a pill */
  #stage #tv-status { left: 84px; bottom: 80px; padding: 0; border-radius: 0; background: none; color: var(--soft);
    font: italic 500 36px/1.2 var(--serif); }
  .num { font-variant-numeric: tabular-nums; }
  .it { font-family: var(--serif); font-style: italic; font-weight: 500; }
  [data-lines] { display: block; overflow: hidden; overflow-wrap: anywhere; }

  /* View: board */
  #board { position: absolute; inset: 0; transition: opacity 300ms; }
  #board.dim { opacity: .45; }
  #board [hidden] { display: none !important; }
  #board section { position: absolute; }
  #board .label { display: flex; align-items: baseline; gap: 24px; height: 36px; margin: 0;
    font-size: 28px; font-weight: 700; line-height: 36px; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }
  /* The small words beside a label: "1 more", or the age of old data */
  #board .x { font: italic 500 28px/36px var(--serif); letter-spacing: 0; text-transform: none; color: var(--soft);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  #board .x:empty { display: none; }

  /* Head: greeting, the clock, the date */
  #head { position: absolute; left: 84px; top: 64px; width: 1040px; }
  #title { margin: 0; font-size: 56px; line-height: 64px; color: var(--soft); }
  #title.long { font-size: 48px; }
  #time { display: flex; align-items: baseline; gap: 26px; width: max-content; margin: 32px 0 0 -14px; color: #b4bcbf;
    font-size: 320px; font-weight: 400; line-height: .8; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  /* The colon: two squares as wide as the stems */
  #hm b { display: inline-block; position: relative; top: -.165em; width: .088em; height: .088em; margin: 0 .07em 0 .115em;
    background: currentColor; box-shadow: 0 -.31em 0 currentColor; opacity: .62; }
  #ampm { font-size: 36px; font-weight: 600; letter-spacing: .12em; color: var(--soft); text-transform: uppercase; }
  #date { margin: 32px 0 0; font-size: 44px; line-height: 1.2; color: var(--soft); }
  #dow { color: var(--text); }
  /* A spare line for an extension (see the header). Only 39px is free above WEATHER, so a shown #sub
     moves the clock and date up to keep a 32px gap. */
  #sub { margin: 8px 0 0; font-size: 28px; line-height: 36px; color: var(--soft); }
  #head:has(#sub:not([hidden])) #time { margin-top: 12px; }
  #head:has(#sub:not([hidden])) #date { margin-top: 15px; }

  /* Weather: the temperature now, and a curve across the coming hours */
  #weather { left: 84px; top: 540px; width: 1000px; }
  #weather [data-slot] { height: 304px; margin-top: 8px; }
  .wx { display: grid; grid-template-columns: 250px 750px; height: 304px; }
  .wx-now { padding-top: 26px; }
  .wx-temp { display: flex; align-items: flex-start; height: 112px; font-size: 112px; font-weight: 400; line-height: 1;
    letter-spacing: -.045em; color: var(--hi); }
  .wx[data-len="4"] .wx-temp { font-size: 92px; }
  .wx[data-len="5"] .wx-temp { font-size: 76px; }
  .wx-u { margin: .13em 0 0 10px; font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: .04em; color: var(--soft); }
  .wx-c { margin-top: 12px; font-size: 36px; line-height: 42px; }
  .wx-c.long { margin-top: 8px; font-size: 32px; line-height: 38px; }
  /* High and low stay on one line. They may run past the column: the chart's axis starts at its first point */
  .wx-hl { display: flex; flex-wrap: wrap; gap: 0 18px; width: 274px; margin-top: 10px; font-size: 28px; color: var(--soft); white-space: nowrap; }
  .wx-g { display: block; width: 750px; height: 304px; overflow: visible; }
  .wx-g text { text-anchor: middle; font-variant-numeric: tabular-nums; }
  .wx-g .v { font: 600 32px var(--sans); fill: var(--hi); }
  .wx-g .h { font: 500 28px var(--sans); fill: var(--soft); }
  .wx-g .h.n { font-weight: 700; fill: var(--accent); }
  .wx-g .a { font: italic 500 28px var(--serif); fill: var(--soft); }
  /* wide: no temperature, the curve takes the width. solo: no curve, the temperature is large. */
  .wx.wide, .wx.solo { grid-template-columns: 1fr; }
  .wx.wide .wx-now, .wx.solo .wx-g, .wx.bare .wx-temp { display: none; }
  .wx.wide .wx-g { width: 1000px; }
  .wx.solo .wx-now { display: flex; align-items: center; gap: 56px; padding-top: 0; }
  .wx.solo .wx-temp { height: auto; font-size: 208px; }
  .wx.solo .wx-u { font-size: 40px; }
  .wx.solo .wx-c { max-width: 640px; margin-top: 0; font-size: 56px; line-height: 64px; }
  .wx.solo .wx-hl { width: auto; font-size: 32px; }

  /* Agenda: a timeline. Times hang left of the rail; every title starts at x = 1340 */
  #agenda { left: 1156px; top: 64px; width: 680px; }
  #ag-top { display: flex; align-items: baseline; justify-content: space-between; height: 64px; margin: 0 0 2px; padding-left: 184px; }
  #ag-h { margin: 0; font-size: 56px; line-height: 64px; color: var(--soft); }
  /* "1 more later" over the age of old data: two short lines, the last one beside the heading */
  #board #x-agenda { align-self: flex-end; margin-bottom: 7px; line-height: 30px; text-align: right; white-space: pre; }
  .ag { list-style: none; margin: 0; padding: 0; }
  .ag li { position: relative; display: grid; grid-template-columns: 124px 60px minmax(0, 1fr); align-items: center; height: 84px; }
  .ag li::before { content: ""; position: absolute; left: 152.5px; top: 42px; width: 3px; height: 100%; background: var(--rule); }
  .ag li.end::before { display: none; }
  .ag .t { text-align: right; font-size: 28px; font-weight: 600; color: var(--soft); white-space: nowrap; }
  .ag .nd { position: relative; justify-self: center; box-sizing: border-box; width: 20px; height: 20px; border-radius: 50%;
    border: 4px solid #5d6970; background: var(--ink); }
  .ag .ti { font-size: 36px; line-height: 40px; }
  .ag .wh { font-size: 28px; line-height: 36px; color: var(--soft); }
  .ag .wh:empty { display: none; }
  .ag.few li { height: 116px; }
  .ag.few li::before { top: 58px; }
  .ag.few .ti { font-size: 44px; line-height: 50px; }
  .ag.few .t { font-size: 32px; }
  .ag li.now { padding-bottom: 44px; }
  .ag li.now .t, .ag li.now .ti { color: var(--hi); }
  .ag li.now .ti { font-weight: 600; }
  .ag li.now .nd { background: var(--hi); border-color: var(--hi); }
  /* The now-line: an amber dot on the rail and a line that fades out. The one amber mark in the column */
  .ag li.now::after { content: ""; position: absolute; left: 143px; bottom: 12px; width: 300px; height: 22px;
    background: radial-gradient(circle at 11px 11px, var(--accent) 0 9px, rgba(224, 169, 108, 0) 10px),
      linear-gradient(to right, var(--accent), rgba(224, 169, 108, 0)) 11px 9px / 100% 4px no-repeat; }
  #agenda .empty { position: relative; margin: 132px 0 0 184px; font-size: 56px; line-height: 64px; color: var(--soft); }
  #agenda .empty::before { content: ""; position: absolute; left: -31.5px; top: 4px; width: 3px; height: 56px; background: #33404a; }

  /* Notes: set like handwriting. The dash hangs on the rail line */
  #notes { left: 1156px; top: 540px; width: 680px; }
  #notes .label { padding-left: 184px; justify-content: space-between; }
  #notes [data-slot] { margin-top: 8px; }
  .nt { list-style: none; margin: 0; padding: 0 0 0 184px; display: grid; gap: 10px; }
  /* Each note is a remote target. Its padding takes in the dash and gives the focus ring room; the margin takes it
     back, so nothing moves */
  .nt li { position: relative; margin: -4px -18px -4px -58px; padding: 4px 18px 4px 58px; border-radius: 14px; font-size: 38px; line-height: 46px; }
  .nt li::before { content: "\2013"; position: absolute; left: 6px; width: 44px; text-align: center; color: #6f7b81; }
  .nt li.done { color: var(--soft); text-decoration: line-through 3px; }
  #notes .empty { margin: 0 0 0 184px; font-size: 38px; line-height: 46px; color: var(--soft); }

  /* Home status: one quiet row of glyphs and words. It gives way to the status line while the agent works */
  #home { left: 84px; right: 84px; top: 940px; height: 76px; display: flex; align-items: center; gap: 60px; transition: opacity 250ms; }
  #home [data-slot] { min-width: 0; }
  #home [data-slot].tv-pending { flex: 1; }
  /* The age of old data follows the last item, on the line of the labels */
  #home:has(.hm) #x-status { align-self: flex-end; }
  #board.busy #home { opacity: 0; }
  .hm { list-style: none; margin: 0; padding: 0; height: 76px; display: flex; align-items: center; gap: 60px; }
  .hm li { position: relative; flex: none; display: flex; align-items: center; gap: 18px; max-width: 420px; }
  #home .ic { flex: none; width: 48px; height: 48px; color: var(--soft); fill: none; stroke: currentColor; stroke-width: 3.5;
    stroke-linecap: round; stroke-linejoin: round; }
  .hm .cx { min-width: 0; }
  .hm .cv { line-height: 42px; }
  .hm .cl { font-size: 28px; line-height: 34px; color: var(--soft); }
  /* The alert is a remote target, with room for the ring like a note */
  .hm li.alert { margin: -14px -18px -8px; padding: 14px 18px 8px; border-radius: 16px; }
  .hm li.alert .cv { color: var(--accent); font-weight: 600; }
  .hm li.alert::before { content: ""; position: absolute; left: 84px; top: 6px; width: 48px; height: 4px; background: var(--accent); }
  #home .empty { margin: 0; font-size: 36px; line-height: 76px; color: var(--soft); }
  /* Dim / Brighten: hidden at rest, so it takes no room. While the remote is in use it shows, and the row makes room */
  #dim { position: absolute; right: -18px; top: 6px; display: flex; align-items: center; gap: 18px; padding: 8px 18px; border: 0;
    border-radius: 16px; background: none; color: var(--soft); font: inherit; opacity: 0; transition: opacity 250ms; }
  #board:focus-within #dim { opacity: 1; }
  #board:focus-within #home { padding-right: 300px; }

  /* Pending: each place keeps its shape, with one quiet phrase. --m1 and --m2 draw the marks */
  #board [data-slot].tv-pending { --m1: #46525a; --m2: #333e46; box-sizing: border-box; font: italic 500 36px/44px var(--serif); color: #8a9499; }
  /* A dimmed board would lose the marks, so they start brighter */
  #board.dim [data-slot].tv-pending { --m1: #8d989e; --m2: #6c787f; --rule: #55616a; color: #aab2b6; }
  #board [data-slot].tv-pending::after { display: none; }
  #board [data-slot="weather"].tv-pending { padding-top: 40px;
    background: radial-gradient(circle, var(--m2) 0 6px, transparent 7px) 41px 199px / 152px 14px repeat-x,
      linear-gradient(var(--rule), var(--rule)) 0 204.5px / 100% 3px no-repeat; }
  #board [data-slot="agenda"].tv-pending { height: 336px; padding: 20px 0 0 184px;
    background: radial-gradient(circle, var(--ink) 0 5px, var(--m1) 6px 9px, transparent 10px) 142.5px 0 / 22px 84px repeat-y,
      linear-gradient(var(--rule), var(--rule)) 152.5px 42px / 3px 252px no-repeat; }
  #board [data-slot="notes"].tv-pending { height: 140px; padding: 1px 0 0 184px;
    background: linear-gradient(var(--m1), var(--m1)) 144px 23px, linear-gradient(var(--m2), var(--m2)) 144px 79px,
      linear-gradient(var(--m2), var(--m2)) 144px 135px; background-size: 20px 3px; background-repeat: no-repeat; }
  #board [data-slot="status"].tv-pending { --r: radial-gradient(circle, transparent 0 16px, var(--m2) 17px 20px, transparent 21px);
    height: 76px; padding-left: 66px; line-height: 76px;
    background: radial-gradient(circle, transparent 0 16px, var(--m1) 17px 20px, transparent 21px) 0, var(--r) 500px,
      var(--r) 780px, var(--r) 1060px, var(--r) 1340px; background-position-y: 14px; background-size: 48px 48px; background-repeat: no-repeat; }
</style>
<body>
<div id="stage">
  <section id="board" data-view="board">
    <header id="head">
      <h1 id="title" class="it" data-lines="1"></h1>
      <div id="time"><span id="hm"></span><span id="ampm"></span></div>
      <p id="date"><span id="dow"></span> <span id="dmy" class="num"></span></p>
      <p id="sub" data-lines="1" hidden></p>
    </header>
    <section id="weather" aria-label="Weather">
      <p class="label"><span>Weather</span><span class="x" id="x-weather"></span></p>
      <div data-slot="weather"></div>
    </section>
    <section id="agenda" aria-label="Agenda">
      <div id="ag-top"><h2 id="ag-h" class="it"></h2><span class="x" id="x-agenda"></span></div>
      <div data-slot="agenda"></div>
    </section>
    <section id="notes" aria-label="Notes" data-tv-group>
      <p class="label"><span>Notes</span><span class="x" id="x-notes"></span></p>
      <div data-slot="notes"></div>
    </section>
    <section id="home" aria-label="Home status" data-tv-group>
      <div data-slot="status"></div>
      <span class="x" id="x-status"></span>
      <button id="dim" data-do="dim"></button>
    </section>
  </section>
</div>
<script>
  const stage = document.getElementById("stage");
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
  new ResizeObserver(fit).observe(document.documentElement);
</script>
<!-- tv-kit:start v2 — copy this block unchanged into every TV app, just before </body>. -->
<style>
  #tv-status { position: absolute; left: 80px; bottom: 60px; z-index: 50; display: flex; align-items: center; gap: 18px;
    padding: 14px 28px 14px 22px; border-radius: 40px; background: rgba(20, 23, 31, .92); color: #c9ccd6;
    font: 500 32px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity 250ms; }
  #tv-status[hidden] { display: flex; opacity: 0; }
  #tv-status i { width: 18px; height: 18px; border-radius: 50%; background: var(--accent, #5b8cff);
    animation: tv-beat 2s steps(2, jump-none) infinite; }
  @keyframes tv-beat { from { opacity: 1; } to { opacity: .3; } }
  [data-slot].tv-pending { color: #8a8e9a; }
  [data-slot].tv-pending::after { content: ""; display: block; width: min(60%, 900px); height: 28px; margin-top: 14px;
    border-radius: 14px; background: #262a34; }
</style>
<script>
  (() => {
    const host = document.getElementById("stage") || document.body;
    const status = document.createElement("div");
    status.id = "tv-status";
    status.setAttribute("role", "status");
    status.hidden = true;
    status.innerHTML = "<i></i><span></span>";
    host.append(status);
    const slot = name => {
      let el = document.querySelector(`[data-slot="${CSS.escape(name)}"]`);
      if (!el) {
        const list = document.querySelector("[data-slots]");
        if (!list) throw new Error(`No element has data-slot="${name}". Use one of: ` +
          [...document.querySelectorAll("[data-slot]")].map(e => e.dataset.slot).join(", "));

};
const bad = (path, want, v) => fail(`${path} must be ${want}; got ${v === undefined ? "nothing" : cut(JSON.stringify(v), 40)}. ` +
  `Send a real value, or leave "${path.split(/[.[]/)[0]}" out of the patch.`);
// Text longer than max is cut at a word. Placeholder text like "<hour>", "{...}" or "..." is refused.
const str = (v, path, ex, max = 80) => {
  if (typeof v === "number" && isFinite(v)) v = String(v);
  if (typeof v !== "string" || !v.trim() || /^\s*(<[^<>]*>|\{[^{}]*\}|\[[^[\]]*\]|\.\.\.|…)\s*$/.test(v)) bad(path, `real text, like ${ex}`, v);
  v = v.trim().replace(/\s+/g, " ");
  if (v.length <= max) return v;
  const sp = v.lastIndexOf(" ", max - 1);
  return v.slice(0, sp > max * .6 ? sp : max - 1).replace(TRAIL, "") + "…";
};
const num = (v, path) => {
  if (typeof v === "string" && v.trim() && isFinite(v)) v = Number(v);
  return typeof v === "number" && isFinite(v) ? v : bad(path, "a number, like 48", v);
};
const bool = (v, path) => typeof v === "boolean" ? v : fail(`${path} must be true or false.`);
const list = (v, path, ex) => Array.isArray(v) ? v.slice(0, KEEP) : bad(path, `a list like [${ex}]`, v);
const obj = (v, path, ex, fields) => {
  if (!isObj(v)) bad(path, `an object like ${ex}`, v);
  for (const k in v) if (!fields.includes(k)) ignored.push(`${path}.${k}`);
};
const agendaItem = (v, p) => {
  obj(v, p, EX.event, ["time", "title", "where", "now"]);
  return { time: str(v.time, `${p}.time`, '"7:00 PM"', 12), title: str(v.title, `${p}.title`, '"Family dinner"'),
    where: v.where ? str(v.where, `${p}.where`, '"Kitchen"', 40) : "", now: v.now == null ? false : bool(v.now, `${p}.now`) };
};
const note = (v, p) => str(v, p, '"Library books are due Friday"', 140);
const statusItem = (v, p) => {
  obj(v, p, EX.status, ["label", "value", "alert"]);
  return { label: str(v.label, `${p}.label`, '"Front door"', 30), value: str(v.value, `${p}.value`, '"Locked"', 30),
    alert: v.alert == null ? false : bool(v.alert, `${p}.alert`) };
};
const set = (k, v) => { state[k] = v; state.at[k] = stamp; };
const same = (a, b) => a.toLowerCase() === b.toLowerCase();

// Handlers run in this order, so timezone, demo and updated_at come before the sections they affect.
const PATCH = {
  timezone(v) {
    if (v == null) { state.timezone = null; return; }
    const z = str(v, "timezone", '"America/Chicago"', 64);
    try { new Intl.DateTimeFormat(undefined, { timeZone: z }); } catch { fail(`timezone must be an IANA name like "America/Chicago", or null for the system zone. "${z}" is not one.`); }
    state.timezone = z;
  },
  // The sample's "now" event started this hour, and its forecast starts with the next hour.
  demo(v) {
    if (!bool(v, "demo")) return;
    const s = structuredClone(SAMPLE), d = hourNow() - 19;
    for (const e of [...s.agenda, ...s.weather.hours]) e.time = later(e.time, d);
    for (const k in s) PATCH[k](s[k]);
  },
  updated_at(v) {
    if (v == null) return;
    const t = typeof v === "number" ? (v < 1e11 ? v * 1000 : v) : typeof v === "string" ? Date.parse(v) : NaN;
    stamp = isFinite(t) ? t : fail('updated_at must be an ISO time like "2026-11-20T19:05:00Z", or epoch seconds or milliseconds.');
  },
  title(v) { state.title = v == null ? null : str(v, "title", '"The Lake House", or null for the greeting', 40); },
  dim(v) { state.dim = bool(v, "dim"); },
  weather(v) {
    if (v == null) { state.weather = null; return; }
    obj(v, "weather", '{"now":{"temp":48,"condition":"Partly cloudy","high":54,"low":41},"hours":[' + EX.hour + '],"unit":"F"}, or null to show it as pending', ["now", "hours", "unit"]);
    const w = state.weather || { now: {}, hours: [], unit: "F" };
    if (v.now != null) {
      obj(v.now, "weather.now", '{"temp":48,"condition":"Partly cloudy","high":54,"low":41}', ["temp", "condition", "high", "low"]);
      for (const k of ["temp", "high", "low"]) if (k in v.now) w.now[k] = v.now[k] == null ? null : num(v.now[k], `weather.now.${k}`);
      if ("condition" in v.now) w.now.condition = v.now.condition == null ? "" : str(v.now.condition, "weather.now.condition", '"Partly cloudy"', 40);
    }
    if (v.hours != null) w.hours = list(v.hours, "weather.hours", EX.hour).slice(0, SHOW.hours).map((h, i) => {
      const p = `weather.hours[${i}]`; obj(h, p, EX.hour, ["time", "temp", "condition"]);
      return { time: str(h.time, `${p}.time`, '"9 PM"', 8), temp: num(h.temp, `${p}.temp`),
        condition: h.condition == null ? "" : str(h.condition, `${p}.condition`, '"Cloudy"', 40) };
    });
    if (v.unit != null) {
      w.unit = String(v.unit).replace("°", "").trim().toUpperCase();
      if (w.unit !== "F" && w.unit !== "C") fail('weather.unit must be "F" or "C".');
    }
    set("weather", w);
  },
  agenda(v) { if (v == null) state.agenda = null; else set("agenda", list(v, "agenda", EX.event).map((e, i) => agendaItem(e, `agenda[${i}]`))); },
  notes(v) { if (v == null) state.notes = null; else set("notes", list(v, "notes", '"Water the fern"').map((t, i) => note(t, `notes[${i}]`))); },
  status(v) { if (v == null) state.status = null; else set("status", list(v, "status", EX.status).map((c, i) => statusItem(c, `status[${i}]`))); },
  add_event(v) {
    const e = agendaItem(v, "add_event"), a = state.agenda || [], m = minutes(e.time);
    if (!a.some(x => x.time === e.time && same(x.title, e.title))) {
      const i = a.findIndex(x => minutes(x.time) > m);
      a.splice(i < 0 ? a.length : i, 0, e);
    }
    set("agenda", a.slice(0, KEEP));
  },
  add_note(v) {
    const t = note(v, "add_note"), n = state.notes || [];
    set("notes", n.some(x => same(x, t)) ? n : [t, ...n].slice(0, KEEP));
  },
  set_status(v) {
    const c = statusItem(v, "set_status");
    set("status", [c, ...(state.status || []).filter(x => !same(x.label, c.label))].slice(0, KEEP));
  },
};

function apply(patch) {
  if (!isObj(patch)) fail('app.apply takes an object, like {"demo":true} or {"add_note":"Call Mom"}.');
  if (!Object.keys(patch).length) fail('An empty patch changes nothing. Send the sections you read, like ' +
    '{"weather":{"now":{"temp":48,"condition":"Rain"}}}, and leave out the ones you could not read. To read the board, call app.state().');
  const before = structuredClone(state);
  ignored = Object.keys(patch).filter(k => !Object.hasOwn(PATCH, k));
  stamp = Date.now();
  try { for (const k in PATCH) if (k in patch) PATCH[k](patch[k]); }
  catch (e) { Object.assign(state, before); ignored = []; throw e; }
  VIEWS.board();
  return app.state();
}

window.app = {
  apply,
  state() {
    // Lists show what is on screen, cut short. age_min: minutes since the section's data was read.
    const c = clock(), w = state.weather, a = state.agenda && agendaShown(), n = state.notes, s = state.status;
    return {
      view: "board", title: state.title ?? `Good ${dayPart()}`, time: `${c.h}:${c.m} ${c.ampm}`.trim(),
      timezone: state.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone, dim: state.dim,
      weather: w && { temp: w.now.temp ?? null, condition: w.now.condition ? condLabel(w.now.condition) : null,
        hours: w.hours.length, unit: w.unit, age_min: age("weather") },
      agenda: a && { shown: a.shown.map(e => cut(`${e.time} ${e.title}`)), more: a.more, age_min: age("agenda") },
      notes: n && { shown: n.slice(0, SHOW.notes).map(t => cut(t)), more: Math.max(0, n.length - SHOW.notes), age_min: age("notes") },
      status: s && { shown: statusOrder().slice(0, statusShown).map(x => cut(`${x.label}: ${x.value}`, 24)),
        alerts: s.filter(x => x.alert).map(x => cut(x.label, 20)), more: s.length - statusShown, age_min: age("status") },
      pending: tv.state().pending, ignored,
    };
  },
};

// Remote input (see the header). Each action runs the patch a voice turn would, then tells the agent with tv.input.
// updated_at keeps the section's age: crossing off a note or acknowledging an alert is not a fresh read.
const REMOTE = {
  done(el, t) {
    el.classList.add("done");
    setTimeout(() => {
      if (!state.notes?.includes(t)) return;
      apply({ notes: state.notes.filter(x => x !== t), updated_at: state.at.notes });
      tv.input("done", { note: t });
    }, 900);
  },
  ack(el, label) {
    apply({ set_status: { ...state.status.find(c => c.label === label), alert: false }, updated_at: state.at.status });
    tv.input("ack", { label });
  },
  dim() { apply({ dim: !state.dim }); tv.input("dim", { dim: state.dim }); },
};
$("board").addEventListener("click", e => { const el = e.target.closest("[data-do]:not(.done)"); if (el) REMOTE[el.dataset.do](el, el.dataset.key); });
for (const type of ["focusin", "focusout"]) $("board").addEventListener(type, fitStatus);
// The board goes back to rest 30 s after the last press: no focus, and Dim hides.
let rest = 0;
addEventListener("keydown", () => { clearTimeout(rest); rest = setTimeout(() => document.activeElement.blur(), 30000); });

// The bottom band holds one line: the home status row, or the status line while the agent works.
// The hidden row is inert, so the remote cannot focus or press an item no one can see.
const line = $("tv-status");
new MutationObserver(() => { $("board").classList.toggle("busy", !line.hidden); $("home").inert = !line.hidden; })
  .observe(line, { attributes: true, attributeFilter: ["hidden"] });
// Text was fitted with the fallback font. Fit it again when the real fonts arrive.
document.fonts.addEventListener("loadingdone", VIEWS.board);
const tick = () => { VIEWS.board(); setTimeout(tick, 60000 - Date.now() % 60000 + 40); };
tick();
if (/[?&]demo\b/.test(location.search)) apply({ demo: true });
booted = true;
})();
</script>
</body>
</html>
